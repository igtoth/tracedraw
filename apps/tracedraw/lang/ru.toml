hinttopic.lines = "Раскрывающаяся группа инструментов **Кривая** содержит инструменты для рисования линий: от руки и точных, прямых и кривых."
hinttopic.move_scale = "Перетащите выбранный объект, чтобы переместить его; **Ctrl** удерживает его по горизонтали или вертикали. **Угловой маркер** масштабирует пропорционально, **боковой маркер** растягивает; **Shift** масштабирует от центра. Клавиши со стрелками сдвигают выделение."
hinttopic.outline = "Задайте ширину, цвет и стиль абриса. **Щелчок правой кнопкой** по цвету палитры окрашивает абрис выделения."
hinttopic.rotate_skew = "Щёлкните выбранный объект ещё раз, чтобы показать маркеры поворота и наклона. **Угловая стрелка** поворачивает, **боковая стрелка** наклоняет; **Ctrl** поворачивает с шагом 15 градусов. Перетащите центральную метку, чтобы сменить центр поворота."
hinttopic.select = "Щёлкните объект, чтобы выбрать его. **Shift**+щелчок добавляет или убирает объекты; перетаскивание по пустому месту выбирает объекты в рамке; **Alt**+щелчок выбирает нижний объект; **Ctrl**+щелчок выбирает объект в группе."
hinttopic.shape_objects = "Меняйте форму объектов, редактируя узлы, искажая контур, разрезая и стирая части."
hinttopic.shapes = "Рисуйте прямоугольники, эллипсы, многоугольники, звёзды, спирали, сетки и готовые фигуры перетаскиванием по диагонали. **Ctrl** сохраняет пропорции; **Shift** рисует от центра."
hinttopic.text = "Щёлкните инструментом **Текст**, чтобы добавить фигурный текст, или перетащите, чтобы добавить простой текст в рамке. Щёлкните внутри текста, чтобы редактировать его."
