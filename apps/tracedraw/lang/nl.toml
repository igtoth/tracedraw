welcome.learn_4_body = "Het gereedschap Vorm (F10) bewerkt knooppunten: dubbelklik op een segment om een knooppunt toe te voegen, dubbelklik op een knooppunt om het te verwijderen, gebruik de eigenschappenbalk voor scherp, vloeiend en symmetrisch."
welcome.learn_4_title = "Knooppunten"
welcome.learn_5_body = "Effecten blijven bewerkbaar: open het paneel van het effect via het menu Effecten, wijzig de waarden en het object wordt bijgewerkt. Effecten samenvoegen legt ze vast."
