welcome.new_from_template = "Nieuw van sjabloon"
welcome.news_1_body = "Contour, overvloeien, omhulling, extrusie (nu in 3D te draaien met meerdere lichten en een schuine rand), lens en de andere effecten blijven live, en het venster Effecten zet elk aan of uit en verandert de volgorde."
welcome.news_1_title = "Live effecten"
welcome.news_2_body = "Benoemde steunkleuren drukken op een eigen plaat, en een uitsnedekader kan een dekkingsmasker zijn waarvan de helderheid bepaalt hoeveel van de inhoud te zien is."
