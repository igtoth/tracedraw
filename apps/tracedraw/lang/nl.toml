welcome.get_started = "Aan de slag"
welcome.learn = "Leren"
welcome.learn_1_body = "Kies een gereedschap in de gereedschapskist (houd een knop ingedrukt voor het uitklapmenu) en sleep op de pagina. Houd Ctrl ingedrukt om te beperken, Shift om vanuit het middelpunt te tekenen."
welcome.learn_1_title = "Tekenen"
welcome.learn_2_body = "Klik om te selecteren, klik nogmaals voor de grepen voor roteren en schuintrekken, sleep hoeken om te schalen. Pijltoetsen verschuiven; Shift+pijltoetsen verschuiven tien keer zo ver."
welcome.learn_2_title = "Selecteren en transformeren"
welcome.learn_3_body = "Klik met de linkermuisknop op een paletkleur voor de vulling, met de rechtermuisknop voor de omtrek. Het paneel Eigenschappen bewerkt verloop-, patroon-, textuur- en meshvullingen."
welcome.learn_3_title = "Vullingen en omtrekken"
welcome.learn_4_body = "Het gereedschap Vorm (F10) bewerkt knooppunten: dubbelklik op een segment om een knooppunt toe te voegen, dubbelklik op een knooppunt om het te verwijderen, gebruik de eigenschappenbalk voor scherp, vloeiend en symmetrisch."
welcome.learn_4_title = "Knooppunten"
welcome.learn_5_body = "Effecten blijven bewerkbaar: open het paneel van het effect via het menu Effecten, wijzig de waarden en het object wordt bijgewerkt. Effecten samenvoegen legt ze vast."
welcome.learn_5_title = "Effecten"
