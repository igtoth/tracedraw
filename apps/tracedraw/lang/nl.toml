web.notice_text = "Dit is hetzelfde Rust-programma als de desktopapp, gecompileerd naar WebAssembly zodat u het kunt proberen zonder iets te installeren. Een browser is trager: grote tekeningen, zware effecten en grote bestanden duren langer, alleen de meegeleverde lettertypen zijn beschikbaar, en bestanden openen via uploaden en worden als downloads opgeslagen. Gebruik voor echt werk en grote bestanden de app voor Windows, macOS of Linux: die draait native, op volle snelheid."
