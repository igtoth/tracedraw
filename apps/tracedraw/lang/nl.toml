welcome.learn = "Leren"
welcome.learn_1_body = "Kies een gereedschap in de gereedschapskist (houd een knop ingedrukt voor het uitklapmenu) en sleep op de pagina. Houd Ctrl ingedrukt om te beperken, Shift om vanuit het middelpunt te tekenen."
welcome.learn_1_title = "Tekenen"
welcome.learn_2_body = "Klik om te selecteren, klik nogmaals voor de grepen voor roteren en schuintrekken, sleep hoeken om te schalen. Pijltoetsen verschuiven; Shift+pijltoetsen verschuiven tien keer zo ver."
