hinttopic.connector_lines = "Verbindingslijnen verbinden objecten en blijven eraan vast als de objecten bewegen."
hinttopic.dimension_lines = "Maatlijnen tonen de grootte van objecten en de afstand of hoek tussen punten; ze worden bijgewerkt als de objecten veranderen."
hinttopic.effects = "Geef objecten diepte en beweging met schaduwen, contouren, overvloeiingen, vervormingen, enveloppen, extrusies en transparantie."
hinttopic.fill = "Vul objecten met effen kleuren, kleurverlopen, patronen, texturen en netten. **Klik** op een paletkleur om de selectie te vullen."
hinttopic.help = "Druk op **F1** voor hulp, laat dit paneel **Tips** open terwijl je werkt en bekijk het welkomstscherm om te beginnen."
hinttopic.lines = "Het uitklapmenu **Curve** bevat de gereedschappen om lijnen te tekenen, uit de vrije hand of precies, recht of gebogen."
hinttopic.move_scale = "Sleep een geselecteerd object om het te verplaatsen; **Ctrl** houdt het op een horizontale of verticale lijn. Sleep een **hoekgreep** om het proportioneel te schalen en een **zijgreep** om het uit te rekken; **Shift** schaalt vanuit het midden. De pijltoetsen verschuiven de selectie een klein stukje."
hinttopic.outline = "Stel de breedte, kleur en stijl van omtrekken in. **Rechtsklik** op een paletkleur om de omtrek van de selectie te kleuren."
hinttopic.rotate_skew = "Klik nogmaals op een geselecteerd object om de grepen voor roteren en scheeftrekken te tonen. Sleep een **hoekpijl** om te roteren en een **zijpijl** om scheef te trekken; **Ctrl** roteert in stappen van 15 graden. Sleep de middenmarkering om het rotatiecentrum te verplaatsen."
hinttopic.select = "Klik op een object om het te selecteren. **Shift**+klik voegt objecten toe of verwijdert ze; sleep op een lege plek om de objecten binnen het selectiekader te selecteren; **Alt**+klik selecteert het object eronder; **Ctrl**+klik selecteert een object binnen een groep."
hinttopic.shape_objects = "Verander de vorm van objecten door hun knooppunten te bewerken, hun omtrek te vervormen of delen ervan weg te snijden en te gummen."
hinttopic.shapes = "Teken rechthoeken, ellipsen, veelhoeken, sterren, spiralen, rasters en kant-en-klare vormen door diagonaal te slepen. **Ctrl** behoudt de verhoudingen; **Shift** tekent vanuit het midden."
hinttopic.text = "Klik met het gereedschap **Tekst** om artistieke tekst toe te voegen, of sleep om alineatekst in een kader toe te voegen. Klik in tekst om die te bewerken."
