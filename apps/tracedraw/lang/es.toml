welcome.choose_workspace = "Elija un espacio de trabajo"
welcome.get_started = "Empezar"
welcome.learn = "Aprender"
welcome.learn_1_body = "Elija una herramienta de la caja de herramientas (mantenga pulsado un botón para ver su menú lateral) y arrastre en la página. Mantenga Ctrl para restringir y Mayús para dibujar desde el centro."
welcome.learn_1_title = "Dibujar"
welcome.learn_2_body = "Haga clic para seleccionar, vuelva a hacer clic para los tiradores de rotación e inclinación, arrastre las esquinas para escalar. Las flechas desplazan; Mayús+flechas desplazan diez veces más."
welcome.learn_2_title = "Seleccionar y transformar"
welcome.learn_3_body = "Clic izquierdo en un color de la paleta para el relleno, clic derecho para el contorno. La ventana Propiedades edita rellenos degradados, de patrón, textura y malla."
welcome.learn_3_title = "Rellenos y contornos"
welcome.learn_4_body = "La herramienta Forma (F10) edita nodos: doble clic en un segmento para añadir un nodo, doble clic en un nodo para eliminarlo, y la barra de propiedades para asimétrico, uniforme y simétrico."
welcome.learn_4_title = "Nodos"
welcome.learn_5_body = "Los efectos siguen siendo editables: abra la ventana del efecto desde el menú Efectos, cambie los valores y el objeto se actualiza. Aplanar efectos fija el resultado."
welcome.learn_5_title = "Efectos"
welcome.my_templates = "Mis plantillas"
welcome.new_document = "Nuevo documento"
welcome.new_from_template = "Nuevo desde plantilla"
welcome.news_1_body = "Silueta, mezcla, envoltura, perspectiva, extrusión, bisel, sombra de bloque, lente y transparencia no uniforme ahora son dinámicos: cámbielos en cualquier momento desde sus ventanas acoplables."
welcome.news_1_title = "Efectos dinámicos"
welcome.news_2_body = "Texto de párrafo con columnas, viñetas, letras capitales, tabulaciones, separación silábica, espaciado, desplazamiento de línea base, funciones OpenType y texto en trayecto."
welcome.news_2_title = "Motor de texto"
welcome.news_3_body = "La interfaz está disponible en inglés, chino, hindi, español, francés, árabe, bengalí, ruso, portugués de Brasil, indonesio, alemán y japonés. Cámbiela en Herramientas > Opciones > Espacio de trabajo."
welcome.news_3_title = "Doce idiomas"
