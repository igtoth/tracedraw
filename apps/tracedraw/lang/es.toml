hintstep.freehand_pick.3 = "Mantenga pulsado Mayús para añadir a la selección, o Ctrl para arrastrar un rectángulo en lugar de un lazo. Los objetos seleccionados se mueven y redimensionan como con la herramienta Selección." # mt
hintstep.free_transform.1 = "Seleccione un objeto, elija Rotación libre en la barra de propiedades y arrastre: el objeto gira alrededor del punto donde pulsó." # mt
hintstep.free_transform.2 = "Reflexión de ángulo libre refleja el objeto sobre la línea que va del punto pulsado al puntero." # mt
hintstep.free_transform.3 = "Escala libre cambia el tamaño del objeto desde el punto pulsado, e Inclinación libre lo inclina." # mt
hintstep.free_transform.4 = "Mantenga pulsado Alt para escalar, Ctrl para inclinar o Mayús para reflejar durante un arrastre. Con Aplicar a duplicado activado, el arrastre transforma una copia." # mt
hintstep.shape.1 = "Haga clic en una curva para ver sus nodos y arrastre un nodo para moverlo." # mt
hintstep.shape.2 = "Haga clic en un nodo para ver sus tiradores de control y arrastre un tirador para cambiar la curvatura." # mt
hintstep.shape.3 = "Arrastre un segmento para curvarlo. Un segmento recto pasa a ser curvo." # mt
hintstep.shape.4 = "Haga doble clic en un segmento para añadir un nodo ahí; haga doble clic en un nodo para eliminarlo." # mt
hintstep.shape.5 = "En un rectángulo, arrastre un nodo de esquina para redondear las esquinas. En una elipse, arrastre el nodo hacia dentro para un sector o hacia fuera para un arco." # mt
hintstep.smooth.1 = "Seleccione una curva y arrastre a lo largo del contorno: las ondulaciones y los nodos sobrantes se suavizan por donde pasa el pincel." # mt
hintstep.smooth.2 = "Tamaño de la punta fija el radio del pincel y Tasa la intensidad del suavizado. El efecto es más fuerte en el centro de la punta." # mt
hintstep.smear.1 = "Seleccione un objeto y arrastre desde dentro del contorno hacia fuera para sacar una prolongación." # mt
hintstep.smear.2 = "Arrastre desde fuera del contorno hacia dentro para hundir una muesca." # mt
hintstep.smear.3 = "Presión en la barra de propiedades fija cuánto se mueve el contorno, y Tamaño de la punta el radio del pincel." # mt
hintstep.twirl.1 = "Seleccione un objeto, ponga la punta sobre el borde y mantenga pulsado el botón del ratón: el contorno se convierte en un remolino que crece mientras mantiene pulsado." # mt
hintstep.twirl.2 = "Elija el sentido horario o antihorario en la barra de propiedades, o mantenga pulsado Alt para girar al revés. Velocidad fija la rapidez del giro." # mt
hintstep.attract_repel.1 = "Seleccione un objeto y mantenga pulsado el botón del ratón con la punta sobre el contorno: Atraer acerca los nodos al puntero." # mt
hintstep.attract_repel.2 = "Elija Repeler, o mantenga pulsado Alt, para alejar los nodos del puntero." # mt
hintstep.attract_repel.3 = "Tamaño de la punta fija la zona que cambia y Velocidad la rapidez del cambio. Si deja el puntero quieto, el efecto continúa." # mt
hintstep.smudge.1 = "Seleccione un objeto y arrastre a través del contorno: el contorno se estira suavemente con el arrastre." # mt
hintstep.smudge.2 = "Presión fija cuánto se estira el contorno, y Tamaño de la punta el radio del pincel." # mt
hintstep.roughen.1 = "Seleccione un objeto y arrastre a lo largo del contorno: aparecen picos irregulares por donde arrastra." # mt
hintstep.roughen.2 = "Frecuencia fija cuántos picos hay, y Tamaño del pico su altura." # mt
hintstep.variable_outline.1 = "Seleccione un objeto con contorno y arrastre a través del contorno: se añade un nodo de anchura y el contorno se ensancha hasta el puntero por ambos lados." # mt
hintstep.variable_outline.2 = "Añada más nodos de anchura del mismo modo. La anchura cambia suavemente de un nodo al siguiente." # mt
hintstep.variable_outline.3 = "Mantenga pulsado Mayús o Alt al empezar a arrastrar para cambiar solo el lado donde está el puntero." # mt
hintstep.variable_outline.4 = "Haga clic en un nodo para escribir sus anchuras izquierda y derecha en la barra de propiedades; Supr lo elimina." # mt
hintstep.crop.1 = "Arrastre un rectángulo sobre la parte que quiere conservar. El dibujo de fuera se oscurece." # mt
hintstep.crop.2 = "Arrastre dentro del área para moverla, o arrastre uno de sus tiradores para cambiar su tamaño." # mt
hintstep.crop.3 = "Haga doble clic dentro del área o pulse Intro para recortar. Esc cancela." # mt
hintstep.knife.1 = "Elija Línea de dos puntos o A mano alzada en la barra de propiedades y arrastre a través de un objeto para cortarlo." # mt
hintstep.knife.2 = "Los trozos pasan a ser objetos separados que puede apartar con la herramienta Selección." # mt
hintstep.knife.3 = "Dividir deja una línea finísima entre los trozos; Separación quita una franja de la anchura que indique." # mt
hintstep.segment_delete.1 = "Haga clic en un tramo de contorno entre dos cruces para eliminarlo." # mt
hintstep.segment_delete.2 = "Arrastre un rectángulo sobre los contornos para eliminar todos los tramos que toca." # mt
hintstep.eraser.1 = "Arrastre sobre un objeto para borrar las partes por las que pasa. Un clic borra un punto." # mt
hintstep.eraser.2 = "Fije el grosor y una punta redonda o cuadrada en la barra de propiedades." # mt
hintstep.eraser.3 = "Haga doble clic en un objeto con la herramienta para eliminarlo entero." # mt
hintstep.zoom.1 = "Haga clic para ampliar en ese punto." # mt
hintstep.zoom.2 = "Arrastre un rectángulo para ampliar hasta que ocupe la ventana." # mt
hintstep.zoom.3 = "Haga clic con el botón derecho o Mayús+clic para reducir. Haga doble clic en el botón de la herramienta para ver todos los objetos." # mt
hintstep.pan.1 = "Arrastre para mover la vista en cualquier dirección. El dibujo no cambia." # mt
hintstep.pan.2 = "Con cualquier herramienta, arrastre con el botón central del ratón para desplazar la vista." # mt
hintstep.freehand.1 = "Arrastre en la página para dibujar una línea por donde pasa el puntero, y suelte para terminar." # mt
hintstep.freehand.2 = "Haga clic donde empieza una línea recta y otra vez donde termina. Mantenga pulsado Ctrl para pasos de 15 grados." # mt
hintstep.freehand.3 = "Empiece en un nodo final de una curva seleccionada para continuarla; termine en su otro extremo para cerrarla." # mt
hintstep.freehand.4 = "Suavizado en la barra de propiedades fija cuánto se suaviza la línea al soltar." # mt
hintstep.two_point_line.1 = "Pulse donde empieza la línea y suelte donde termina." # mt
hintstep.two_point_line.2 = "Mantenga pulsado Ctrl para limitar la línea a pasos de 15 grados." # mt
hintstep.bezier.1 = "Haga clic para colocar un nodo de esquina, y otra vez para trazar un segmento recto hasta él." # mt
hintstep.bezier.2 = "Arrastre para colocar un nodo suave y sacar sus tiradores, que fijan la dirección y la curvatura." # mt
hintstep.bezier.3 = "Haga clic en el primer nodo para cerrar la curva, o haga doble clic o pulse Intro para terminar. Esc descarta la curva." # mt
hintstep.pen.1 = "Haga clic para añadir nodos de esquina unidos por segmentos rectos." # mt
hintstep.pen.2 = "Arrastre para añadir un nodo suave: la curva toma forma mientras arrastra, y el siguiente segmento sigue al puntero." # mt
hintstep.pen.3 = "Haga clic en el primer nodo para cerrar la curva, o haga doble clic o pulse Intro para terminar." # mt
hintstep.bspline.1 = "Haga clic para colocar los puntos de control. La curva los sigue suavemente y siempre queda dentro de ellos." # mt
hintstep.bspline.2 = "Haga doble clic o pulse Intro para terminar, o haga clic en el primer punto para cerrar la curva en un bucle." # mt
hintstep.polyline.1 = "Haga clic para añadir cada esquina: los segmentos rectos se suceden uno tras otro." # mt
hintstep.polyline.2 = "Haga doble clic o pulse Intro para terminar, o haga clic en el primer nodo para cerrar la forma. Ctrl limita cada segmento a pasos de 15 grados." # mt
hintstep.three_point_curve.1 = "Arrastre desde donde empieza la curva hasta donde termina." # mt
hintstep.three_point_curve.2 = "Mueva el puntero para curvar la línea y haga clic en el punto por el que pasa." # mt
hintstep.brush_strokes.1 = "Elija un modo y una anchura en la barra de propiedades: Preestablecido, Pincel, Pulverizador, Caligráfico o Presión." # mt
hintstep.brush_strokes.2 = "Arrastre en la página: la línea se convierte en un trazo relleno cuya anchura cambia a lo largo." # mt
hintstep.brush_strokes.3 = "Para convertir curvas existentes en trazos, selecciónelas y haga clic en Aplicar a la curva en el panel Trazos de pincel." # mt
hintstep.painterly_brush.1 = "Elija un pincel, un tamaño y una transparencia en la barra de propiedades y arrastre en la página." # mt
hintstep.painterly_brush.2 = "Para pintar el contorno de un objeto existente, haga clic en él y elija un pincel." # mt
hintstep.painterly_brush.3 = "Borrar pincelada devuelve el contorno simple a los objetos seleccionados." # mt
hintstep.shape_recognition.1 = "Dibuje un rectángulo, una elipse o un triángulo aproximado de un solo trazo: se convierte en una forma limpia." # mt
hintstep.shape_recognition.2 = "Un trazo casi recto se convierte en una línea recta; los demás trazos, en curvas suaves." # mt
hintstep.shape_recognition.3 = "Reconocimiento de formas y Suavizado en la barra de propiedades fijan con qué facilidad los trazos se convierten en formas y cuánto se suavizan." # mt
hintstep.sketch.1 = "Dibuje un trazo: se suaviza y queda seleccionado." # mt
hintstep.sketch.2 = "Empiece el siguiente trazo cerca del final del anterior. Con Unir activado, se añade a la misma curva." # mt
hintstep.rectangle.1 = "Arrastre en diagonal desde una esquina hasta la opuesta." # mt
hintstep.rectangle.2 = "Mantenga pulsado Ctrl para dibujar un cuadrado, o Mayús para dibujar desde el centro." # mt
hintstep.rectangle.3 = "Fije esquinas redondeadas, festoneadas o achaflanadas en la barra de propiedades, o arrastre un nodo de esquina con la herramienta Forma." # mt
hintstep.rectangle.4 = "Haga doble clic en el botón de la herramienta para dibujar un rectángulo del tamaño de la página." # mt
hintstep.three_point_rectangle.1 = "Arrastre para trazar la línea de base, con cualquier ángulo." # mt
hintstep.three_point_rectangle.2 = "Mueva el puntero para fijar la altura y haga clic." # mt
hintstep.ellipse.1 = "Arrastre en diagonal para dibujar una elipse." # mt
hintstep.ellipse.2 = "Mantenga pulsado Ctrl para dibujar un círculo, o Mayús para dibujar desde el centro." # mt
hintstep.ellipse.3 = "Elija Sector o Arco en la barra de propiedades, o arrastre el nodo de la elipse con la herramienta Forma." # mt
hintstep.three_point_ellipse.1 = "Arrastre para trazar la línea central de la elipse, con cualquier ángulo." # mt
hintstep.three_point_ellipse.2 = "Mueva el puntero para fijar la altura y haga clic." # mt
hintstep.polygon.1 = "Fije el número de puntos en la barra de propiedades y arrastre en diagonal." # mt
hintstep.polygon.2 = "Mantenga pulsado Ctrl para un polígono simétrico, o Mayús para dibujar desde el centro." # mt
hintstep.polygon.3 = "Arrastre un nodo con la herramienta Forma: los nodos correspondientes de todos los lados lo siguen y el polígono sigue siendo simétrico." # mt
hintstep.star.1 = "Fije el número de puntos y la agudeza en la barra de propiedades y arrastre." # mt
hintstep.star.2 = "Elija Estrella compleja para una estrella cuyos lados se cruzan." # mt
hintstep.star.3 = "Mantenga pulsado Ctrl para una estrella simétrica, o Mayús para dibujar desde el centro." # mt
hintstep.spiral.1 = "Fije el número de revoluciones en la barra de propiedades y arrastre." # mt
hintstep.spiral.2 = "Elija Simétrica para vueltas igual de separadas, o Logarítmica para vueltas cada vez más separadas." # mt
hintstep.spiral.3 = "Mantenga pulsado Ctrl para una espiral redonda, o Mayús para dibujar desde el centro." # mt
hintstep.common_shapes.1 = "Haga clic en el botón de forma de la barra de propiedades y elija una forma: formas básicas, flechas, símbolos de diagrama de flujo, cintas o llamadas." # mt
hintstep.common_shapes.2 = "Arrastre para dibujar la forma. Mantenga pulsado Ctrl para conservar sus proporciones, o Mayús para dibujar desde el centro." # mt
hintstep.action_lines.1 = "Elija Paralelo o Radial y el número de líneas en la barra de propiedades." # mt
hintstep.action_lines.2 = "Arrastre un recuadro: las líneas de velocidad lo llenan." # mt
hintstep.graph_paper.1 = "Fije el número de filas y columnas en la barra de propiedades." # mt
hintstep.graph_paper.2 = "Arrastre para dibujar la cuadrícula. Mantenga pulsado Ctrl para celdas cuadradas." # mt
hintstep.graph_paper.3 = "La cuadrícula es un grupo de rectángulos: desagrúpela para colorear o mover celdas sueltas." # mt
hintstep.text.1 = "Haga clic donde empieza el texto y escriba: texto artístico. Intro empieza una línea nueva." # mt
hintstep.text.2 = "Arrastre un marco y escriba: el texto de párrafo se ajusta a los bordes del marco." # mt
hintstep.text.3 = "Pulse Esc para terminar. Haga clic en un texto con la herramienta para editarlo, y elija la fuente, el tamaño y el estilo en la barra de propiedades." # mt
hintstep.table.1 = "Fije el número de filas y columnas en la barra de propiedades y arrastre un rectángulo." # mt
hintstep.table.2 = "Haga clic en una celda y escriba. Tab pasa a la celda siguiente." # mt
hintstep.table.3 = "El menú Tabla inserta, elimina, combina y divide filas y columnas." # mt
hintstep.parallel_dimension.1 = "Arrastre desde el primer punto hasta el segundo, o haga clic en ambos." # mt
hintstep.parallel_dimension.2 = "Mueva el puntero y haga clic donde va la línea de cota." # mt
hintstep.parallel_dimension.3 = "Ajuste a los nodos para medidas exactas. Fije la precisión y las unidades en la barra de propiedades." # mt
hintstep.hv_dimension.1 = "Arrastre desde el primer punto hasta el segundo, o haga clic en ambos." # mt
hintstep.hv_dimension.2 = "Mueva el puntero y haga clic donde va la línea. Solo mide la distancia horizontal o la vertical." # mt
hintstep.angular_dimension.1 = "Haga clic en el vértice del ángulo." # mt
hintstep.angular_dimension.2 = "Haga clic en un punto del primer lado y luego en un punto del segundo lado." # mt
hintstep.angular_dimension.3 = "Haga clic donde van el arco y la etiqueta." # mt
hintstep.segment_dimension.1 = "Haga clic en un segmento de un objeto para tomar sus dos extremos." # mt
hintstep.segment_dimension.2 = "Haga clic donde va la línea de cota." # mt
hintstep.callout.1 = "Arrastre desde la punta, el punto al que señala la llamada, hasta el codo." # mt
hintstep.callout.2 = "Haga clic donde va el texto y escríbalo." # mt
hintstep.callout.3 = "Elija la cabeza de la punta y una forma alrededor del texto en la barra de propiedades." # mt
hintstep.connector.1 = "Arrastre de un objeto a otro: la línea une sus anclas." # mt
hintstep.connector.2 = "Mueva o cambie el tamaño de cualquiera de los objetos: el conector sigue unido." # mt
hintstep.right_angle_connector.1 = "Arrastre de un objeto a otro: el conector va en segmentos horizontales y verticales." # mt
hintstep.right_angle_connector.2 = "Mueva cualquiera de los objetos: el conector sigue unido y busca un nuevo recorrido." # mt
hintstep.rounded_connector.1 = "Arrastre de un objeto a otro: el conector va en segmentos horizontales y verticales con esquinas redondeadas." # mt
hintstep.rounded_connector.2 = "Fije el radio de esquina en la barra de propiedades. Mueva cualquiera de los objetos y el conector lo sigue." # mt
hintstep.anchor_editing.1 = "Haga clic en un objeto para ver sus anclas como rombos." # mt
hintstep.anchor_editing.2 = "Haga clic dentro del objeto para añadir un ancla, y arrastre un ancla añadida para moverla." # mt
hintstep.anchor_editing.3 = "Seleccione un ancla y pulse Supr, o haga doble clic en ella, para quitarla. Las cuatro anclas del centro de los lados siempre se quedan." # mt
hintstep.drop_shadow.1 = "Arrastre desde el centro de un objeto hasta donde debe caer la sombra." # mt
hintstep.drop_shadow.2 = "Arrastre desde un borde del objeto para una sombra en perspectiva apoyada en ese borde." # mt
hintstep.drop_shadow.3 = "Arrastre el regulador entre los tiradores para cambiar la opacidad, y el tirador final para mover la sombra." # mt
hintstep.drop_shadow.4 = "Fije el difuminado y el color en la barra de propiedades." # mt
hintstep.contour.1 = "Arrastre desde un objeto hacia fuera para una silueta exterior." # mt
hintstep.contour.2 = "Arrastre hacia su centro para una silueta interior." # mt
hintstep.contour.3 = "Fije los pasos, el desplazamiento y los colores del último paso en la barra de propiedades." # mt
hintstep.blend.1 = "Arrastre de un objeto a otro: aparecen pasos intermedios entre ellos." # mt
hintstep.blend.2 = "Fije el número de pasos en la barra de propiedades. Mueva, redimensione o cambie el color de cualquiera de los objetos y los pasos lo siguen." # mt
hintstep.distort.1 = "Empujar y tirar: arrastre hacia la derecha sobre el objeto para hacer picos, o hacia la izquierda para pétalos redondeados." # mt
hintstep.distort.2 = "Cremallera: arrastre alejándose del inicio para hacer dientes en zigzag. Cuanto más lejos arrastre, más altos son." # mt
hintstep.distort.3 = "Torbellino: arrastre alrededor del punto inicial para retorcer el objeto." # mt
hintstep.distort.4 = "Arrastre el rombo para mover el centro de la distorsión. Arrastrar de nuevo la sustituye." # mt
hintstep.envelope.1 = "Haga clic en un objeto: aparece a su alrededor un marco de ocho nodos." # mt
hintstep.envelope.2 = "Arrastre los nodos para cambiar la forma del marco. El objeto se curva para llenarlo." # mt
hintstep.envelope.3 = "Elija Línea recta, Arco simple, Arco doble o Sin restricciones en la barra de propiedades para fijar cómo se curvan los lados." # mt
hintstep.extrude.1 = "Arrastre desde un objeto: los lados van desde su contorno hacia el final del arrastre, el punto de fuga." # mt
hintstep.extrude.2 = "Arrastre el tirador con la cruz para mover el punto de fuga." # mt
hintstep.extrude.3 = "Fije la profundidad, la iluminación y los colores en la barra de propiedades." # mt
hintstep.block_shadow.1 = "Arrastre desde un objeto en la dirección en que debe ir la sombra." # mt
hintstep.block_shadow.2 = "Fije la profundidad, la dirección, el color y la separación en la barra de propiedades." # mt
hintstep.transparency.1 = "Haga clic en un objeto y elija Uniforme en la barra de propiedades para la misma transparencia en todo él." # mt
hintstep.transparency.2 = "Arrastre a través de un objeto para una transparencia degradada: opaca donde pulsa, transparente donde suelta." # mt
hintstep.transparency.3 = "Arrastre el regulador para mover el punto medio de la mezcla, y los nodos para cambiar su longitud y su ángulo." # mt
hintstep.color_eyedropper.1 = "Haga clic en un objeto para tomar su color." # mt
hintstep.color_eyedropper.2 = "Haga clic en otros objetos para rellenarlos con ese color; Mayús+clic colorea su contorno." # mt
hintstep.color_eyedropper.3 = "Haga clic en el botón de selección de la barra de propiedades para tomar otra muestra. Esc vuelve a la herramienta Selección." # mt
hintstep.attributes_eyedropper.1 = "Haga clic en el objeto del que copiar." # mt
hintstep.attributes_eyedropper.2 = "Haga clic en cada objeto al que copiar." # mt
hintstep.attributes_eyedropper.3 = "Elija en la barra de propiedades qué copiar: propiedades, transformaciones o efectos. Mayús+clic toma otro objeto como muestra." # mt
hintstep.interactive_fill.1 = "Arrastre a través de un objeto: un relleno degradado va desde donde pulsa hasta donde suelta." # mt
hintstep.interactive_fill.2 = "Arrastre el regulador entre los nodos para mover el punto donde los colores se encuentran a medio camino." # mt
hintstep.interactive_fill.3 = "Arrastre el nodo final para cambiar la longitud y el ángulo del degradado." # mt
hintstep.interactive_fill.4 = "Haga doble clic en la línea para añadir un nodo de color, y arrastre un color de la paleta sobre un nodo para cambiar su color." # mt
hintstep.area_fill.1 = "Haga clic dentro de cualquier área cerrada, aunque la formen varios objetos superpuestos." # mt
hintstep.area_fill.2 = "El área se convierte en un nuevo objeto relleno; los objetos de alrededor quedan como estaban." # mt
hintstep.area_fill.3 = "Elija el relleno y el contorno del nuevo objeto en la barra de propiedades." # mt
hintstep.mesh_fill.1 = "Fije las filas y columnas en la barra de propiedades y haga clic en un objeto para añadirle una malla." # mt
hintstep.mesh_fill.2 = "Haga clic en un nodo y luego en un color de la paleta para colorearlo." # mt
hintstep.mesh_fill.3 = "Arrastre los nodos para curvar el flujo de los colores." # mt
hintstep.mesh_fill.4 = "Haga doble clic dentro de la malla para añadir una fila y una columna; Supr quita la fila y la columna del nodo seleccionado." # mt
hintstep.outline_pen.1 = "Seleccione un objeto y elija la herramienta: se abre el cuadro de diálogo Pluma de contorno." # mt
hintstep.outline_pen.2 = "Fije la anchura, el estilo, las esquinas, los extremos de línea y las puntas de flecha, y haga clic en Aceptar." # mt
hintstep.outline_pen.3 = "Sin nada seleccionado, los ajustes valen para los objetos que dibuje a continuación." # mt
hintstep.outline_color.1 = "Seleccione un objeto y elija la herramienta: se abre el panel Color." # mt
hintstep.outline_color.2 = "Elija un color para fijar el color del contorno. Hacer clic con el botón derecho en un color de la paleta hace lo mismo." # mt
