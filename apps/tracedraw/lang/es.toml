web.notice_title = "TraceDraw en tu navegador"
web.notice_text = "Es el mismo programa en Rust que la aplicación de escritorio, compilado a WebAssembly para que lo pruebes sin instalar nada. Un navegador es más lento: los dibujos grandes, los efectos pesados y los archivos grandes tardan más, solo están las fuentes incluidas, y los archivos se abren subiéndolos y se guardan como descargas. Para trabajo real y archivos grandes, usa la aplicación para Windows, macOS o Linux: funciona de forma nativa, a toda velocidad."
