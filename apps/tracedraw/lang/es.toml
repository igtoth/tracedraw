hinttopic.connector_lines = "Las líneas conectoras unen objetos y siguen unidas cuando los objetos se mueven."
hinttopic.dimension_lines = "Las líneas de cota muestran el tamaño de los objetos y la distancia o el ángulo entre puntos; se actualizan cuando los objetos cambian."
hinttopic.effects = "Dé profundidad y movimiento a los objetos con sombras, contornos, mezclas, distorsiones, envolturas, extrusiones y transparencia."
hinttopic.fill = "Rellene objetos con colores uniformes, degradados, patrones, texturas y mallas. **Haga clic** en un color de la paleta para rellenar la selección."
hinttopic.help = "Pulse **F1** para obtener ayuda, mantenga abierto este panel **Sugerencias** mientras trabaja y consulte la pantalla de bienvenida para empezar."
hinttopic.lines = "El menú lateral de herramientas de **Curva** reúne las herramientas para dibujar líneas, a mano alzada o precisas, rectas o curvas."
hinttopic.move_scale = "Arrastre un objeto seleccionado para moverlo; **Ctrl** lo mantiene en horizontal o vertical. Arrastre un **tirador de esquina** para escalar proporcionalmente y un **tirador lateral** para estirar; **Mayús** escala desde el centro. Las teclas de flecha desplazan la selección."
hinttopic.outline = "Defina el grosor, el color y el estilo de los contornos. **Haga clic con el botón derecho** en un color de la paleta para colorear el contorno de la selección."
hinttopic.rotate_skew = "Vuelva a hacer clic en un objeto seleccionado para ver los tiradores de giro e inclinación. Arrastre una **flecha de esquina** para girar y una **flecha lateral** para inclinar; **Ctrl** gira de 15 en 15 grados. Arrastre el marcador central para cambiar el centro de giro."
hinttopic.select = "Haga clic en un objeto para seleccionarlo. **Mayús**+clic añade o quita objetos; arrastre en un área vacía para seleccionar los objetos dentro del marco; **Alt**+clic selecciona el objeto de debajo; **Ctrl**+clic selecciona un objeto dentro de un grupo."
hinttopic.shape_objects = "Cambie la forma de los objetos editando sus nodos, deformando el contorno o cortando y borrando partes."
hinttopic.shapes = "Dibuje rectángulos, elipses, polígonos, estrellas, espirales, cuadrículas y formas listas arrastrando en diagonal. **Ctrl** mantiene las proporciones; **Mayús** dibuja desde el centro."
hinttopic.text = "Haga clic con la herramienta **Texto** para añadir texto artístico o arrastre para añadir texto de párrafo en un marco. Haga clic dentro del texto para editarlo."
