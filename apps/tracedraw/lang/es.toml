welcome.news_1_title = "Efectos dinámicos"
welcome.news_2_body = "Las tintas planas con nombre se imprimen en su propia plancha, y un marco de recorte puede ser una máscara de opacidad cuyo brillo decide cuánto se ve del contenido."
