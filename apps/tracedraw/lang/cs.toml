hintstep.zoom.3 = "Klikněte pravým tlačítkem nebo Shift+kliknutím oddálíte. Dvojitým kliknutím na tlačítko nástroje zobrazíte všechny objekty." # mt
hintstep.pan.1 = "Tažením posunete zobrazení libovolným směrem. Kresba se nemění." # mt
