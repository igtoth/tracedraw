hinttopic.rotate_skew = "Dalším kliknutím na vybraný objekt zobrazíte úchyty pro otočení a zkosení. Tažením za **rohovou šipku** objekt otočíte, tažením za **boční šipku** jej zkosíte; s klávesou **Ctrl** se otáčí po krocích 15 stupňů. Tažením značky středu změníte střed otáčení."
hinttopic.select = "Kliknutím na objekt jej vyberete. **Shift**+kliknutí přidá nebo odebere objekty; tažením na prázdné ploše vyberete objekty uvnitř obdélníku výběru; **Alt**+kliknutí vybere objekt pod ním; **Ctrl**+kliknutí vybere objekt uvnitř skupiny."
hinttopic.shape_objects = "Tvar objektů změníte úpravou jejich uzlů, zkreslením obrysu nebo vyříznutím a vymazáním jejich částí."
hinttopic.shapes = "Tažením úhlopříčně nakreslíte obdélníky, elipsy, mnohoúhelníky, hvězdy, spirály, mřížky a hotové tvary. **Ctrl** zachová proporce; **Shift** kreslí od středu."
hinttopic.text = "Kliknutím nástrojem **Text** přidáte umělecký text, tažením přidáte odstavcový text v rámečku. Kliknutím do textu jej upravíte."
