welcome.learn = "Výuka"
welcome.learn_1_body = "Vyberte nástroj ze sady nástrojů (podržením tlačítka zobrazíte jeho nabídku) a táhněte na stránce. Podržením Ctrl kreslení omezíte, se Shift kreslíte od středu."
welcome.learn_1_title = "Kreslení"
welcome.learn_2_body = "Kliknutím vyberete, dalším kliknutím zobrazíte úchyty pro otočení a zkosení, tažením rohů změníte velikost. Klávesy se šipkami posouvají po malých krocích; Shift+šipky posouvají desetkrát dále."
welcome.learn_2_title = "Výběr a transformace"
welcome.learn_3_body = "Kliknutím levým tlačítkem na barvu palety nastavíte výplň, pravým tlačítkem obrys. Panel Vlastnosti upravuje přechodové, vzorové, texturové a síťové výplně."
welcome.learn_3_title = "Výplně a obrysy"
welcome.learn_4_body = "Nástroj Tvar (F10) upravuje uzly: dvojitým kliknutím na segment přidáte uzel, dvojitým kliknutím na uzel jej odstraníte, na liště vlastností nastavíte hrotový, hladký a symetrický uzel."
welcome.learn_4_title = "Uzly"
welcome.learn_5_body = "Efekty zůstávají upravitelné: otevřete panel efektu z nabídky Efekty, změňte hodnoty a objekt se aktualizuje. Příkaz Zploštit efekty je zapéká natrvalo."
welcome.learn_5_title = "Efekty"
welcome.my_templates = "Moje šablony"
welcome.new_document = "Nový dokument"
welcome.new_from_template = "Nový ze šablony"
welcome.news_1_body = "Obrys, prolnutí, obálka, vysunutí (nyní otáčené ve 3D s několika světly a zkosením), čočka a další efekty zůstávají živé a panel Efekty každý zapíná, vypíná a mění jejich pořadí."
welcome.news_1_title = "Živé efekty"
welcome.news_2_body = "Pojmenované přímé barvy se tisknou na vlastní desky a rámeček ořezu může být maskou krytí, jejíž jas určuje, kolik obsahu je vidět."
welcome.news_2_title = "Přímé barvy a masky"
