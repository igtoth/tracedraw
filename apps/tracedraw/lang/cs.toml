hinttopic.help = "Nápovědu zobrazíte klávesou **F1**, panel **Rady** nechte při práci otevřený a pro začátek se podívejte na Uvítací obrazovku."
hinttopic.lines = "Nabídka nástrojů **Křivka** obsahuje nástroje pro kreslení čar, od ruky i přesně, rovných i zakřivených."
hinttopic.move_scale = "Tažením vybraného objektu jej přesunete; s klávesou **Ctrl** zůstane na vodorovné nebo svislé přímce. Tažením za **rohový úchyt** změníte velikost proporcionálně, tažením za **boční úchyt** objekt roztáhnete; s klávesou **Shift** se velikost mění od středu. Klávesami se šipkami výběr posunete po malých krocích."
