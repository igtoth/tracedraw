# Hints panel: the steps of each tool's page (ui/hint_pics.rs)
hintstep.pick.1 = "Klikněte na objekt, abyste ho vybrali. Kolem něj se objeví osm úchytů." # mt
hintstep.pick.2 = "Přetažením objekt přesunete. Přetažením rohového úchytu změníte velikost v poměru, bočním úchytem objekt roztáhnete." # mt
hintstep.pick.3 = "Klikněte na vybraný objekt znovu a zobrazí se úchyty otočení: tažením rohové šipky objekt otočíte, boční šipkou ho zkosíte." # mt
hintstep.pick.4 = "Natáhněte rámeček kolem objektů, začněte na prázdném místě, a vyberou se všechny objekty, které jsou celé uvnitř." # mt
hintstep.pick.5 = "Shift+kliknutí přidá objekt do výběru nebo ho odebere; Ctrl+kliknutí vybere objekt uvnitř skupiny; Alt+kliknutí vybere objekt pod ním." # mt
hintstep.freehand_pick.1 = "Táhněte smyčku kolem požadovaných objektů. Po uvolnění se vybere každý objekt, který je celý uvnitř smyčky." # mt
hintstep.freehand_pick.2 = "Při uvolnění držte Alt a vyberou se všechny objekty, kterých se smyčka dotkne." # mt
hintstep.freehand_pick.3 = "Držte Shift pro přidání do výběru, nebo Ctrl pro tažení obdélníku místo smyčky. Vybrané objekty se přesouvají a mění velikost jako nástrojem Výběr." # mt
hintstep.free_transform.1 = "Vyberte objekt, na liště vlastností zvolte Volné otočení a táhněte: objekt se otáčí kolem bodu, kde jste stiskli tlačítko." # mt
hintstep.free_transform.2 = "Volné zrcadlení podle úhlu zrcadlí objekt podle čáry od bodu stisknutí k ukazateli." # mt
hintstep.free_transform.3 = "Volná změna měřítka mění velikost objektu od bodu stisknutí a Volné zkosení ho zkosí." # mt
hintstep.free_transform.4 = "Během jednoho tažení držte Alt pro změnu měřítka, Ctrl pro zkosení nebo Shift pro zrcadlení. Se zapnutým Použít na duplikát tažení transformuje kopii." # mt
hintstep.shape.1 = "Klikněte na křivku, zobrazí se její uzly, a pak uzel přetáhněte, abyste ho přesunuli." # mt
hintstep.shape.2 = "Klikněte na uzel, zobrazí se jeho řídicí úchyty, a tažením úchytu změňte ohyb křivky." # mt
hintstep.shape.3 = "Tažením segmentu ho ohnete. Rovný segment se změní na zakřivený." # mt
hintstep.shape.4 = "Dvojitým kliknutím na segment tam přidáte uzel; dvojitým kliknutím na uzel ho smažete." # mt
hintstep.shape.5 = "U obdélníku zaoblíte rohy tažením rohového uzlu. U elipsy táhněte uzel dovnitř pro výseč nebo ven pro oblouk." # mt
hintstep.smooth.1 = "Vyberte křivku a táhněte podél jejího obrysu: kde štětec projde, vlnky a nadbytečné uzly se vyhladí." # mt
hintstep.smooth.2 = "Velikost hrotu určuje poloměr štětce a Míra sílu vyhlazení. Účinek je nejsilnější uprostřed hrotu." # mt
hintstep.smear.1 = "Vyberte objekt a táhněte zevnitř obrysu ven, abyste vytáhli výběžek." # mt
hintstep.smear.2 = "Táhněte zvenku obrysu dovnitř, abyste vtlačili promáčknutí." # mt
hintstep.smear.3 = "Tlak na liště vlastností určuje, jak daleko se obrys posune, a Velikost hrotu poloměr štětce." # mt
hintstep.twirl.1 = "Vyberte objekt, umístěte hrot na jeho okraj a podržte tlačítko myši: obrys se změní ve vír, který roste, dokud držíte." # mt
hintstep.twirl.2 = "Na liště vlastností zvolte směr po nebo proti směru hodinových ručiček, nebo podržte Alt pro otáčení opačně. Rychlost určuje, jak rychle se otáčí." # mt
hintstep.attract_repel.1 = "Vyberte objekt a podržte tlačítko myši s hrotem nad obrysem: Přitahovat táhne uzly k ukazateli." # mt
hintstep.attract_repel.2 = "Zvolte Odpuzovat, nebo podržte Alt, a uzly se odtlačí od ukazatele." # mt
hintstep.attract_repel.3 = "Velikost hrotu určuje oblast změny a Rychlost, jak rychle se mění. Když ukazatel držíte na místě, účinek pokračuje." # mt
hintstep.smudge.1 = "Vyberte objekt a táhněte přes jeho obrys: obrys se plynule táhne s pohybem." # mt
hintstep.smudge.2 = "Tlak určuje, jak daleko se obrys táhne, a Velikost hrotu poloměr štětce." # mt
hintstep.roughen.1 = "Vyberte objekt a táhněte podél obrysu: kde táhnete, objeví se zubaté hroty." # mt
hintstep.roughen.2 = "Frekvence určuje počet hrotů a Velikost hrotů jejich výšku." # mt
hintstep.variable_outline.1 = "Vyberte objekt s obrysem a táhněte přes obrys: přidá se uzel šířky a obrys se rozšíří k ukazateli na obou stranách." # mt
hintstep.variable_outline.2 = "Stejně přidejte další uzly šířky. Šířka se plynule mění od jednoho uzlu k dalšímu." # mt
hintstep.variable_outline.3 = "Na začátku tažení držte Shift nebo Alt a změní se jen strana, na které je ukazatel." # mt
hintstep.variable_outline.4 = "Klikněte na uzel a zadejte jeho levou a pravou šířku na liště vlastností; Delete ho odebere." # mt
hintstep.crop.1 = "Natáhněte obdélník přes část, kterou chcete zachovat. Kresba mimo něj se ztlumí." # mt
hintstep.crop.2 = "Tažením uvnitř oblasti ji přesunete, tažením některého z úchytů změníte její velikost." # mt
hintstep.crop.3 = "Ořízněte dvojitým kliknutím uvnitř oblasti nebo klávesou Enter. Esc akci zruší." # mt
hintstep.knife.1 = "Na liště vlastností zvolte Čára ze dvou bodů nebo Od ruky a táhněte přes objekt, abyste ho rozřízli." # mt
hintstep.knife.2 = "Z kusů se stanou samostatné objekty, které můžete nástrojem Výběr rozsunout." # mt
hintstep.knife.3 = "Rozdělit nechá mezi kusy vlasovou linku; Mezera odstraní pás o nastavené šířce." # mt
hintstep.segment_delete.1 = "Klikněte na část obrysu mezi dvěma průsečíky a smažete ji." # mt
hintstep.segment_delete.2 = "Natáhněte obdélník přes obrysy a smaže se každá část, které se dotkne." # mt
hintstep.eraser.1 = "Táhněte přes objekt a vymažete části, přes které projdete. Kliknutí vymaže jeden bod." # mt
hintstep.eraser.2 = "Na liště vlastností nastavte tloušťku a kulatý nebo čtvercový hrot." # mt
hintstep.eraser.3 = "Dvojitým kliknutím na objekt tímto nástrojem ho smažete celý." # mt
hintstep.zoom.1 = "Kliknutím přiblížíte v daném bodě." # mt
