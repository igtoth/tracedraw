web.notice_title = "TraceDraw v prohlížeči"
web.notice_text = "Je to stejný program v Rustu jako aplikace pro počítač, zkompilovaný do WebAssembly, abyste ho mohli vyzkoušet bez instalace. Prohlížeč je pomalejší: velké kresby, náročné efekty a velké soubory trvají déle, k dispozici jsou jen přibalená písma a soubory se otevírají nahráním a ukládají jako stažené. Pro skutečnou práci a velké soubory použijte aplikaci pro Windows, macOS nebo Linux: běží nativně, plnou rychlostí."
