# Hints panel: the steps of each tool's page (ui/hint_pics.rs)
hintstep.pick.1 = "কোনো অবজেক্ট বাছতে তাতে ক্লিক করুন। এর চারপাশে আটটি হ্যান্ডেল দেখা যায়।" # mt
hintstep.pick.2 = "অবজেক্ট সরাতে সেটি টেনে আনুন। অনুপাত রেখে আকার বদলাতে কোণের হ্যান্ডেল টানুন, অথবা প্রসারিত করতে পাশের হ্যান্ডেল টানুন।" # mt
hintstep.pick.3 = "ঘূর্ণন হ্যান্ডেল দেখাতে বাছাই করা অবজেক্টে আবার ক্লিক করুন: ঘোরাতে কোণের তীর টানুন, হেলাতে পাশের তীর টানুন।" # mt
hintstep.pick.4 = "ফাঁকা জায়গা থেকে শুরু করে অবজেক্টগুলোর চারপাশে একটি ফ্রেম টানুন, যাতে পুরোপুরি ভিতরে থাকা প্রতিটি অবজেক্ট বাছা হয়।" # mt
hintstep.pick.5 = "Shift+ক্লিক কোনো অবজেক্টকে বাছাইয়ে যোগ করে বা বাদ দেয়; Ctrl+ক্লিক গ্রুপের ভিতরের অবজেক্ট বাছে; Alt+ক্লিক নিচের অবজেক্ট বাছে।" # mt
hintstep.freehand_pick.1 = "যে অবজেক্টগুলো চান তাদের চারপাশে একটি লুপ টানুন। ছেড়ে দিলে পুরোপুরি লুপের ভিতরে থাকা প্রতিটি অবজেক্ট বাছা হয়।" # mt
hintstep.freehand_pick.2 = "লুপ যে যে অবজেক্ট ছোঁয় সবগুলো বাছতে ছাড়ার সময় Alt চেপে রাখুন।" # mt
hintstep.freehand_pick.3 = "বাছাইয়ে যোগ করতে Shift চেপে রাখুন, অথবা লুপের বদলে আয়তক্ষেত্র টানতে Ctrl। বাছাই করা অবজেক্ট পিক টুলের মতোই সরে ও আকার বদলায়।" # mt
hintstep.free_transform.1 = "একটি অবজেক্ট বাছুন, প্রপার্টি বারে মুক্ত ঘূর্ণন বেছে নিয়ে টানুন: যেখানে চাপেন সেই বিন্দুর চারদিকে অবজেক্ট ঘোরে।" # mt
hintstep.free_transform.2 = "মুক্ত কোণ প্রতিফলন চাপার বিন্দু থেকে পয়েন্টার পর্যন্ত রেখার সাপেক্ষে অবজেক্টকে আয়নার মতো উল্টায়।" # mt
hintstep.free_transform.3 = "মুক্ত স্কেল চাপার বিন্দু থেকে অবজেক্টের আকার বদলায়, আর মুক্ত তির্যক সেটিকে হেলিয়ে দেয়।" # mt
hintstep.free_transform.4 = "একবার টানার জন্য স্কেল করতে Alt, হেলাতে Ctrl বা প্রতিফলনের জন্য Shift চেপে রাখুন। অনুলিপিতে প্রয়োগ চালু থাকলে টানা একটি অনুলিপিকে রূপান্তর করে।" # mt
hintstep.shape.1 = "কোনো কার্ভের নোড দেখাতে তাতে ক্লিক করুন, তারপর নোড সরাতে সেটি টানুন।" # mt
hintstep.shape.2 = "কোনো নোডের নিয়ন্ত্রণ হ্যান্ডেল দেখাতে তাতে ক্লিক করুন, আর কার্ভের বাঁক বদলাতে হ্যান্ডেল টানুন।" # mt
hintstep.shape.3 = "কোনো অংশ বাঁকাতে সেটি টানুন। সোজা অংশ বাঁকা হয়ে যায়।" # mt
hintstep.shape.4 = "সেখানে নোড যোগ করতে অংশে ডাবল-ক্লিক করুন; নোড মুছতে নোডে ডাবল-ক্লিক করুন।" # mt
hintstep.shape.5 = "আয়তক্ষেত্রে কোণ গোল করতে কোণের নোড টানুন। উপবৃত্তে পাইয়ের জন্য নোড ভিতরে, চাপের জন্য বাইরে টানুন।" # mt
hintstep.smooth.1 = "একটি কার্ভ বাছুন এবং তার আউটলাইন ধরে টানুন: ব্রাশ যেখান দিয়ে যায় সেখানে ঢেউ ও বাড়তি নোড মসৃণ হয়ে যায়।" # mt
hintstep.smooth.2 = "নিবের আকার ব্রাশের ব্যাসার্ধ ঠিক করে আর হার কতটা মসৃণ করবে তা। নিবের কেন্দ্রে প্রভাব সবচেয়ে বেশি।" # mt
hintstep.smear.1 = "একটি অবজেক্ট বাছুন এবং একটি উঁচু অংশ টেনে বের করতে আউটলাইনের ভিতর থেকে বাইরের দিকে টানুন।" # mt
hintstep.smear.2 = "একটি খাঁজ ঢোকাতে আউটলাইনের বাইরে থেকে ভিতরের দিকে টানুন।" # mt
hintstep.smear.3 = "প্রপার্টি বারের চাপ ঠিক করে আউটলাইন কতদূর সরবে, আর নিবের আকার ব্রাশের ব্যাসার্ধ।" # mt
hintstep.twirl.1 = "একটি অবজেক্ট বাছুন, নিব তার কিনারায় রাখুন এবং মাউস বোতাম চেপে রাখুন: আউটলাইন একটি ঘূর্ণি হয়ে যায় যা চেপে রাখা পর্যন্ত বাড়ে।" # mt
hintstep.twirl.2 = "প্রপার্টি বারে ঘড়ির কাঁটার দিকে বা বিপরীতে বেছে নিন, অথবা উল্টো দিকে ঘোরাতে Alt চেপে রাখুন। গতি ঠিক করে কত দ্রুত ঘোরে।" # mt
hintstep.attract_repel.1 = "একটি অবজেক্ট বাছুন এবং নিব আউটলাইনের উপর রেখে মাউস বোতাম চেপে রাখুন: আকর্ষণ নোডগুলোকে পয়েন্টারের দিকে টানে।" # mt
hintstep.attract_repel.2 = "নোডগুলোকে পয়েন্টার থেকে দূরে ঠেলতে বিকর্ষণ বেছে নিন, অথবা Alt চেপে রাখুন।" # mt
hintstep.attract_repel.3 = "নিবের আকার পরিবর্তনের এলাকা ঠিক করে আর গতি কত দ্রুত বদলায় তা। পয়েন্টার স্থির রাখলে প্রভাব চলতে থাকে।" # mt
hintstep.smudge.1 = "একটি অবজেক্ট বাছুন এবং তার আউটলাইনের আড়াআড়ি টানুন: আউটলাইন টানার সঙ্গে মসৃণভাবে টেনে নেওয়া হয়।" # mt
hintstep.smudge.2 = "চাপ ঠিক করে আউটলাইন কতদূর টানা হবে, আর নিবের আকার ব্রাশের ব্যাসার্ধ।" # mt
hintstep.roughen.1 = "একটি অবজেক্ট বাছুন এবং তার আউটলাইন ধরে টানুন: যেখানে টানেন সেখানে খাঁজকাটা কাঁটা দেখা দেয়।" # mt
hintstep.roughen.2 = "কম্পাঙ্ক ঠিক করে কতগুলো কাঁটা হবে, আর কাঁটার আকার সেগুলো কত উঁচু হবে।" # mt
hintstep.variable_outline.1 = "আউটলাইনসহ একটি অবজেক্ট বাছুন এবং আউটলাইনের আড়াআড়ি টানুন: একটি প্রস্থ নোড যোগ হয় এবং আউটলাইন দুই পাশে পয়েন্টার পর্যন্ত চওড়া হয়।" # mt
hintstep.variable_outline.2 = "একইভাবে আরও প্রস্থ নোড যোগ করুন। প্রস্থ এক নোড থেকে পরের নোডে মসৃণভাবে বদলায়।" # mt
hintstep.variable_outline.3 = "শুধু পয়েন্টার যে পাশে আছে সেটি বদলাতে টানা শুরুর সময় Shift বা Alt চেপে রাখুন।" # mt
hintstep.variable_outline.4 = "প্রপার্টি বারে বাম ও ডান প্রস্থ লিখতে নোডে ক্লিক করুন; Delete সেটি মুছে দেয়।" # mt
hintstep.crop.1 = "যে অংশ রাখতে চান তার উপর একটি আয়তক্ষেত্র টানুন। তার বাইরের আঁকা ম্লান হয়ে যায়।" # mt
hintstep.crop.2 = "এলাকাটি সরাতে তার ভিতরে টানুন, অথবা আকার বদলাতে তার কোনো হ্যান্ডেল টানুন।" # mt
hintstep.crop.3 = "ক্রপ করতে এলাকার ভিতরে ডাবল-ক্লিক করুন বা Enter চাপুন। Esc বাতিল করে।" # mt
hintstep.knife.1 = "প্রপার্টি বারে দুই-বিন্দু রেখা বা ফ্রিহ্যান্ড বেছে নিন, তারপর কাটতে অবজেক্টের আড়াআড়ি টানুন।" # mt
hintstep.knife.2 = "টুকরোগুলো আলাদা অবজেক্ট হয়ে যায়, যা পিক টুল দিয়ে আলাদা করে সরানো যায়।" # mt
hintstep.knife.3 = "ভাগ করুন টুকরোগুলোর মাঝে একটি সরু রেখা রাখে; ফাঁক আপনার ঠিক করা প্রস্থের একটি ফালি সরিয়ে দেয়।" # mt
hintstep.segment_delete.1 = "আউটলাইনের দুটি ছেদবিন্দুর মাঝের অংশ মুছতে তাতে ক্লিক করুন।" # mt
hintstep.segment_delete.2 = "আউটলাইনের আড়াআড়ি একটি আয়তক্ষেত্র টানুন, যাতে সেটি যে অংশ ছোঁয় সব মুছে যায়।" # mt
