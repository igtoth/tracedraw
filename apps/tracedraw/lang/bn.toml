welcome.learn_3_body = "ফিলের জন্য প্যালেটের রঙে বাম-ক্লিক, আউটলাইনের জন্য ডান-ক্লিক করুন। বৈশিষ্ট্য ডকার ফাউন্টেন, প্যাটার্ন, টেক্সচার ও মেশ ফিল সম্পাদনা করে।"
welcome.learn_3_title = "ফিল ও আউটলাইন"
welcome.learn_4_body = "শেপ টুল (F10) নোড সম্পাদনা করে: নোড যোগ করতে সেগমেন্টে ডাবল-ক্লিক, নোড মুছতে নোডে ডাবল-ক্লিক করুন, কাস্প, মসৃণ ও প্রতিসমের জন্য প্রপার্টি বার ব্যবহার করুন।"
welcome.learn_4_title = "নোড"
welcome.learn_5_body = "ইফেক্ট সম্পাদনাযোগ্য থাকে: ইফেক্ট মেনু থেকে ইফেক্টের ডকার খুলুন, মান বদলান এবং অবজেক্ট হালনাগাদ হবে। ইফেক্ট ফ্ল্যাটেন করুন তাদের স্থায়ী করে।"
