web.notice_title = "আপনার ব্রাউজারে TraceDraw"
web.notice_text = "এটি ডেস্কটপ অ্যাপের একই Rust প্রোগ্রাম, WebAssembly-তে কম্পাইল করা যাতে কিছু ইনস্টল না করেই চেষ্টা করতে পারেন। ব্রাউজার ধীর: বড় ড্রয়িং, ভারী ইফেক্ট ও বড় ফাইলে বেশি সময় লাগে, শুধু সঙ্গে আসা ফন্টগুলো পাওয়া যায়, এবং ফাইল আপলোড করে খোলা হয় ও ডাউনলোড হিসেবে সংরক্ষিত হয়। আসল কাজ ও বড় ফাইলের জন্য Windows, macOS বা Linux অ্যাপ ব্যবহার করুন: এটি নেটিভভাবে, পূর্ণ গতিতে চলে।"
