welcome.news_2_body = "কলাম, বুলেট, ড্রপ ক্যাপ, ট্যাব, হাইফেনেশন, ট্র্যাকিং, বেসলাইন শিফট, OpenType বৈশিষ্ট্য ও পাথে টেক্সটসহ প্যারাগ্রাফ টেক্সট।"
