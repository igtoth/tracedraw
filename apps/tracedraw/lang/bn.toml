hintstep.table.2 = "একটি ঘরে ক্লিক করে টাইপ করুন। Tab পরের ঘরে যায়।" # mt
hintstep.table.3 = "টেবিল মেনু সারি ও কলাম যোগ করে, মোছে, একত্র করে এবং ভাগ করে।" # mt
hintstep.parallel_dimension.1 = "প্রথম বিন্দু থেকে দ্বিতীয় বিন্দুতে টানুন, অথবা দুটিতেই ক্লিক করুন।" # mt
hintstep.parallel_dimension.2 = "পয়েন্টার সরান এবং যেখানে মাপের রেখা যাবে সেখানে ক্লিক করুন।" # mt
hintstep.parallel_dimension.3 = "সঠিক মাপের জন্য নোডে স্ন্যাপ করুন। প্রপার্টি বারে নির্ভুলতা ও একক ঠিক করুন।" # mt
hintstep.hv_dimension.1 = "প্রথম বিন্দু থেকে দ্বিতীয় বিন্দুতে টানুন, অথবা দুটিতেই ক্লিক করুন।" # mt
hintstep.hv_dimension.2 = "পয়েন্টার সরান এবং যেখানে রেখা যাবে সেখানে ক্লিক করুন। এটি শুধু অনুভূমিক বা উল্লম্ব দূরত্ব মাপে।" # mt
hintstep.angular_dimension.1 = "কোণের শীর্ষবিন্দুতে ক্লিক করুন।" # mt
hintstep.angular_dimension.2 = "প্রথম বাহুর একটি বিন্দুতে ক্লিক করুন, তারপর দ্বিতীয় বাহুর একটি বিন্দুতে।" # mt
hintstep.angular_dimension.3 = "যেখানে চাপ ও লেবেল যাবে সেখানে ক্লিক করুন।" # mt
hintstep.segment_dimension.1 = "কোনো অবজেক্টের অংশের দুই প্রান্ত নিতে সেই অংশে ক্লিক করুন।" # mt
hintstep.segment_dimension.2 = "যেখানে মাপের রেখা যাবে সেখানে ক্লিক করুন।" # mt
hintstep.callout.1 = "ডগা, অর্থাৎ কলআউট যে বিন্দু দেখায়, সেখান থেকে বাঁক পর্যন্ত টানুন।" # mt
hintstep.callout.2 = "যেখানে টেক্সট যাবে সেখানে ক্লিক করুন, তারপর টেক্সট টাইপ করুন।" # mt
hintstep.callout.3 = "প্রপার্টি বারে ডগার মাথা এবং টেক্সটের চারপাশের আকৃতি বেছে নিন।" # mt
hintstep.connector.1 = "এক অবজেক্ট থেকে আরেকটিতে টানুন: রেখাটি তাদের অ্যাঙ্করের মাঝে চলে।" # mt
hintstep.connector.2 = "যেকোনো অবজেক্ট সরান বা আকার বদলান: সংযোজক যুক্তই থাকে।" # mt
hintstep.right_angle_connector.1 = "এক অবজেক্ট থেকে আরেকটিতে টানুন: সংযোজক অনুভূমিক ও উল্লম্ব অংশে চলে।" # mt
hintstep.right_angle_connector.2 = "যেকোনো অবজেক্ট সরান: সংযোজক যুক্ত থাকে এবং নতুন পথ খুঁজে নেয়।" # mt
hintstep.rounded_connector.1 = "এক অবজেক্ট থেকে আরেকটিতে টানুন: সংযোজক গোল কোণসহ অনুভূমিক ও উল্লম্ব অংশে চলে।" # mt
hintstep.rounded_connector.2 = "প্রপার্টি বারে কোণের ব্যাসার্ধ ঠিক করুন। যেকোনো অবজেক্ট সরালে সংযোজক অনুসরণ করে।" # mt
hintstep.anchor_editing.1 = "কোনো অবজেক্টের অ্যাঙ্কর হীরার আকারে দেখাতে তাতে ক্লিক করুন।" # mt
hintstep.anchor_editing.2 = "অ্যাঙ্কর যোগ করতে অবজেক্টের ভিতরে ক্লিক করুন, এবং যোগ করা অ্যাঙ্কর সরাতে সেটি টানুন।" # mt
hintstep.anchor_editing.3 = "অ্যাঙ্কর মুছতে সেটি বেছে Delete চাপুন, অথবা তাতে ডাবল-ক্লিক করুন। বাহুগুলোর মাঝখানের চারটি অ্যাঙ্কর সবসময় থাকে।" # mt
hintstep.drop_shadow.1 = "অবজেক্টের মাঝখান থেকে যেখানে ছায়া পড়বে সেখানে টানুন।" # mt
hintstep.drop_shadow.2 = "সেই কিনারায় দাঁড়ানো পরিপ্রেক্ষিত ছায়ার জন্য অবজেক্টের কোনো কিনারা থেকে টানুন।" # mt
hintstep.drop_shadow.3 = "অস্বচ্ছতা বদলাতে হ্যান্ডেলের মাঝের স্লাইডার টানুন, আর ছায়া সরাতে শেষ হ্যান্ডেল।" # mt
hintstep.drop_shadow.4 = "প্রপার্টি বারে ফেদারিং ও রং ঠিক করুন।" # mt
hintstep.contour.1 = "বাইরের কনটুরের জন্য অবজেক্ট থেকে বাইরের দিকে টানুন।" # mt
hintstep.contour.2 = "ভিতরের কনটুরের জন্য তার মাঝখানের দিকে টানুন।" # mt
hintstep.contour.3 = "প্রপার্টি বারে ধাপ, অফসেট এবং শেষ ধাপের রং ঠিক করুন।" # mt
hintstep.blend.1 = "এক অবজেক্ট থেকে আরেকটিতে টানুন: তাদের মাঝে মধ্যবর্তী ধাপ দেখা দেয়।" # mt
hintstep.blend.2 = "প্রপার্টি বারে ধাপের সংখ্যা ঠিক করুন। যেকোনো অবজেক্ট সরান, আকার বা রং বদলান, ধাপগুলো অনুসরণ করে।" # mt
hintstep.distort.1 = "পুশ ও পুল: কাঁটার জন্য অবজেক্টে ডানে টানুন, অথবা গোল পাপড়ির জন্য বামে।" # mt
hintstep.distort.2 = "জিপার: আঁকাবাঁকা দাঁতের জন্য শুরু থেকে দূরে টানুন। যত দূরে টানবেন, তত উঁচু হবে।" # mt
hintstep.distort.3 = "টুইস্টার: অবজেক্টকে পাক খাওয়াতে শুরুর বিন্দুর চারদিকে টানুন।" # mt
hintstep.distort.4 = "বিকৃতির কেন্দ্র সরাতে হীরাটি টানুন। আবার টানলে আগেরটি বদলে যায়।" # mt
hintstep.envelope.1 = "একটি অবজেক্টে ক্লিক করুন: তার চারপাশে আটটি নোডের একটি ফ্রেম দেখা দেয়।" # mt
hintstep.envelope.2 = "ফ্রেমের আকার বদলাতে নোড টানুন। অবজেক্ট সেটি ভরাতে বেঁকে যায়।" # mt
hintstep.envelope.3 = "বাহুগুলো কীভাবে বাঁকবে তা ঠিক করতে প্রপার্টি বারে সরলরেখা, একক বক্ররেখা, দ্বৈত বক্ররেখা বা অবাধ বেছে নিন।" # mt
hintstep.extrude.1 = "অবজেক্ট থেকে টানুন: পাশের তলগুলো তার আউটলাইন থেকে টানার শেষ, অর্থাৎ বিলীন বিন্দু, পর্যন্ত যায়।" # mt
hintstep.extrude.2 = "বিলীন বিন্দু সরাতে ক্রস চিহ্নের হ্যান্ডেল টানুন।" # mt
hintstep.extrude.3 = "প্রপার্টি বারে গভীরতা, আলো ও রং ঠিক করুন।" # mt
hintstep.block_shadow.1 = "অবজেক্ট থেকে যে দিকে ছায়া যাবে সে দিকে টানুন।" # mt
hintstep.block_shadow.2 = "প্রপার্টি বারে গভীরতা, দিক, রং ও ফাঁক ঠিক করুন।" # mt
hintstep.transparency.1 = "সব জায়গায় একই স্বচ্ছতার জন্য অবজেক্টে ক্লিক করে প্রপার্টি বারে সমরূপ বেছে নিন।" # mt
hintstep.transparency.2 = "গ্রেডিয়েন্ট স্বচ্ছতার জন্য অবজেক্টের আড়াআড়ি টানুন: যেখানে চাপেন সেখানে অস্বচ্ছ, যেখানে ছাড়েন সেখানে স্বচ্ছ।" # mt
hintstep.transparency.3 = "মিশ্রণের মাঝামাঝি বিন্দু সরাতে স্লাইডার টানুন, আর দৈর্ঘ্য ও কোণ বদলাতে নোড।" # mt
hintstep.color_eyedropper.1 = "অবজেক্টের রং নিতে তাতে ক্লিক করুন।" # mt
hintstep.color_eyedropper.2 = "অন্য অবজেক্ট সেই রঙে ভরাতে সেগুলোতে ক্লিক করুন; Shift+ক্লিক তাদের আউটলাইন রং করে।" # mt
hintstep.color_eyedropper.3 = "আবার রং নিতে প্রপার্টি বারের বাছাই বোতামে ক্লিক করুন। Esc পিক টুলে ফিরে যায়।" # mt
hintstep.attributes_eyedropper.1 = "যে অবজেক্ট থেকে কপি করবেন তাতে ক্লিক করুন।" # mt
hintstep.attributes_eyedropper.2 = "যেসব অবজেক্টে কপি করবেন তাদের প্রতিটিতে ক্লিক করুন।" # mt
hintstep.attributes_eyedropper.3 = "প্রপার্টি বারে বেছে নিন কী কপি হবে: বৈশিষ্ট্য, রূপান্তর বা ইফেক্ট। Shift+ক্লিক অন্য অবজেক্ট থেকে নমুনা নেয়।" # mt
hintstep.interactive_fill.1 = "অবজেক্টের আড়াআড়ি টানুন: গ্রেডিয়েন্ট ফিল যেখানে চাপেন সেখান থেকে যেখানে ছাড়েন সেখান পর্যন্ত যায়।" # mt
hintstep.interactive_fill.2 = "রংগুলো যেখানে মাঝপথে মেলে সেই বিন্দু সরাতে নোডের মাঝের স্লাইডার টানুন।" # mt
hintstep.interactive_fill.3 = "গ্রেডিয়েন্টের দৈর্ঘ্য ও কোণ বদলাতে শেষ নোড টানুন।" # mt
hintstep.interactive_fill.4 = "রং নোড যোগ করতে রেখায় ডাবল-ক্লিক করুন, এবং নোডের রং বদলাতে প্যালেট থেকে একটি রং তার উপর টেনে আনুন।" # mt
hintstep.area_fill.1 = "যেকোনো বন্ধ এলাকার ভিতরে ক্লিক করুন, এমনকি কয়েকটি পরস্পর ঢাকা অবজেক্ট দিয়ে তৈরি এলাকাতেও।" # mt
hintstep.area_fill.2 = "এলাকাটি একটি নতুন ভরাট অবজেক্ট হয়ে যায়; চারপাশের অবজেক্টগুলো যেমন আছে তেমনই থাকে।" # mt
hintstep.area_fill.3 = "প্রপার্টি বারে নতুন অবজেক্টের ফিল ও আউটলাইন বেছে নিন।" # mt
hintstep.mesh_fill.1 = "প্রপার্টি বারে সারি ও কলাম ঠিক করুন এবং মেশ যোগ করতে অবজেক্টে ক্লিক করুন।" # mt
hintstep.mesh_fill.2 = "একটি নোডে ক্লিক করুন, তারপর সেটি রং করতে প্যালেটের একটি রঙে ক্লিক করুন।" # mt
hintstep.mesh_fill.3 = "রঙের প্রবাহ বাঁকাতে নোড টানুন।" # mt
hintstep.mesh_fill.4 = "একটি সারি ও একটি কলাম যোগ করতে মেশের ভিতরে ডাবল-ক্লিক করুন; Delete বাছাই করা নোডের সারি ও কলাম মুছে দেয়।" # mt
hintstep.outline_pen.1 = "একটি অবজেক্ট বাছুন এবং টুলটি বেছে নিন: আউটলাইন পেন ডায়ালগ বক্স খোলে।" # mt
hintstep.outline_pen.2 = "প্রস্থ, শৈলী, কোণ, রেখার প্রান্ত ও তীরের মাথা ঠিক করে ঠিক আছে ক্লিক করুন।" # mt
hintstep.outline_pen.3 = "কিছু বাছাই না থাকলে সেটিংস পরে আঁকা অবজেক্টে প্রয়োগ হয়।" # mt
hintstep.outline_color.1 = "একটি অবজেক্ট বাছুন এবং টুলটি বেছে নিন: রং প্যানেল খোলে।" # mt
hintstep.outline_color.2 = "আউটলাইনের রং ঠিক করতে একটি রং বেছে নিন। প্যালেটের কোনো রঙে রাইট-ক্লিক করলেও একই হয়।" # mt
