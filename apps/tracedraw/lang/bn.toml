hinttopic.fill = "অবজেক্টকে সমরূপ রং, গ্রেডিয়েন্ট, প্যাটার্ন, টেক্সচার ও মেশ দিয়ে পূরণ করুন। নির্বাচন পূরণ করতে প্যালেটের রঙে **ক্লিক** করুন।"
hinttopic.help = "সাহায্যের জন্য **F1** চাপুন, কাজের সময় এই **ইঙ্গিত** প্যানেল খোলা রাখুন, আর শুরু করতে স্বাগতম স্ক্রিন দেখুন।"
hinttopic.lines = "**বক্ররেখা** টুল ফ্লাইআউটে রেখা আঁকার টুল আছে: মুক্তহস্ত বা নিখুঁত, সরল বা বাঁকা।"
hinttopic.move_scale = "সরাতে বাছা অবজেক্ট টানুন; **Ctrl** অনুভূমিক বা উল্লম্ব রাখে। **কোণের হ্যান্ডেল** অনুপাতে মাপ বদলায়, **পাশের হ্যান্ডেল** টেনে লম্বা করে; **Shift** কেন্দ্র থেকে মাপ বদলায়। তীর কী নির্বাচন সামান্য সরায়।"
hinttopic.outline = "রূপরেখার প্রস্থ, রং ও শৈলী ঠিক করুন। নির্বাচনের রূপরেখা রাঙাতে প্যালেটের রঙে **ডান-ক্লিক** করুন।"
hinttopic.rotate_skew = "ঘোরানো ও হেলানোর হ্যান্ডেল দেখাতে বাছা অবজেক্টে আবার ক্লিক করুন। **কোণের তীর** ঘোরায়, **পাশের তীর** হেলায়; **Ctrl** ১৫ ডিগ্রি ধাপে ঘোরায়। ঘূর্ণন কেন্দ্র বদলাতে কেন্দ্র চিহ্ন টানুন।"
hinttopic.select = "বাছতে অবজেক্টে ক্লিক করুন। **Shift**+ক্লিক অবজেক্ট যোগ বা বাদ দেয়; খালি জায়গায় টানলে ঘেরের ভিতরের অবজেক্ট বাছা হয়; **Alt**+ক্লিক নিচেরটি বাছে; **Ctrl**+ক্লিক গ্রুপের ভিতরের অবজেক্ট বাছে।"
hinttopic.shape_objects = "নোড সম্পাদনা, রূপরেখা বিকৃতি বা অংশ কেটে ও মুছে অবজেক্টের আকার বদলান।"
hinttopic.shapes = "কোনাকুনি টেনে আয়ত, উপবৃত্ত, বহুভুজ, তারা, সর্পিল, গ্রিড ও তৈরি আকার আঁকুন। **Ctrl** অনুপাত রাখে; **Shift** কেন্দ্র থেকে আঁকে।"
hinttopic.text = "শৈল্পিক টেক্সট যোগ করতে **টেক্সট** টুলে ক্লিক করুন, বা ফ্রেমে অনুচ্ছেদ টেক্সটের জন্য টানুন। সম্পাদনা করতে টেক্সটের ভিতরে ক্লিক করুন।"
