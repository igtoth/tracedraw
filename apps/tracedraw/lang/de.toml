web.notice_title = "TraceDraw im Browser"
web.notice_text = "Das ist dasselbe Rust-Programm wie die Desktop-App, nach WebAssembly kompiliert, damit Sie es ohne Installation ausprobieren können. Ein Browser ist langsamer: große Zeichnungen, aufwendige Effekte und große Dateien brauchen länger, nur die mitgelieferten Schriften stehen bereit, und Dateien werden hochgeladen und als Downloads gespeichert. Für echte Arbeit und große Dateien nehmen Sie die Desktop-App für Windows, macOS oder Linux: Sie läuft nativ, mit voller Geschwindigkeit."
