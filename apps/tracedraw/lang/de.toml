# Hints panel: the steps of each tool's page (ui/hint_pics.rs)
hintstep.pick.1 = "Klicken Sie auf ein Objekt, um es auszuwählen. Acht Griffe erscheinen um das Objekt." # mt
hintstep.pick.2 = "Ziehen Sie das Objekt, um es zu verschieben. Ziehen Sie einen Eckgriff, um die Größe proportional zu ändern, oder einen Seitengriff, um es zu strecken." # mt
hintstep.pick.3 = "Klicken Sie erneut auf das ausgewählte Objekt, um die Drehgriffe anzuzeigen: Ziehen Sie einen Eckpfeil zum Drehen und einen Seitenpfeil zum Neigen." # mt
hintstep.pick.4 = "Ziehen Sie von einer leeren Stelle aus einen Rahmen um Objekte, um alle Objekte auszuwählen, die vollständig darin liegen." # mt
hintstep.pick.5 = "Umschalt+Klick fügt ein Objekt zur Auswahl hinzu oder nimmt es heraus; Strg+Klick wählt ein Objekt in einer Gruppe aus; Alt+Klick wählt das darunterliegende Objekt aus." # mt
hintstep.freehand_pick.1 = "Ziehen Sie eine Schleife um die gewünschten Objekte. Beim Loslassen werden alle Objekte ausgewählt, die vollständig in der Schleife liegen." # mt
hintstep.freehand_pick.2 = "Halten Sie beim Loslassen Alt gedrückt, um alle Objekte auszuwählen, die die Schleife berührt." # mt
hintstep.freehand_pick.3 = "Halten Sie Umschalt gedrückt, um zur Auswahl hinzuzufügen, oder Strg, um statt einer Schleife ein Rechteck aufzuziehen. Ausgewählte Objekte lassen sich wie mit dem Auswahlwerkzeug verschieben und skalieren." # mt
hintstep.free_transform.1 = "Wählen Sie ein Objekt aus, wählen Sie in der Eigenschaftsleiste Freie Drehung und ziehen Sie: Das Objekt dreht sich um den Punkt, an dem Sie gedrückt haben." # mt
hintstep.free_transform.2 = "Freie Winkelspiegelung spiegelt das Objekt an der Linie vom Druckpunkt zum Mauszeiger." # mt
hintstep.free_transform.3 = "Freie Skalierung ändert die Größe des Objekts vom Druckpunkt aus, Freie Neigung neigt es." # mt
hintstep.free_transform.4 = "Halten Sie für einen Zug Alt zum Skalieren, Strg zum Neigen oder Umschalt zum Spiegeln gedrückt. Mit Auf Duplikat anwenden verändert der Zug eine Kopie." # mt
hintstep.shape.1 = "Klicken Sie auf eine Kurve, um ihre Knoten anzuzeigen, und ziehen Sie einen Knoten, um ihn zu verschieben." # mt
hintstep.shape.2 = "Klicken Sie auf einen Knoten, um seine Steuergriffe anzuzeigen, und ziehen Sie einen Griff, um die Krümmung zu ändern." # mt
hintstep.shape.3 = "Ziehen Sie ein Segment, um es zu biegen. Ein gerades Segment wird gekrümmt." # mt
hintstep.shape.4 = "Doppelklicken Sie auf ein Segment, um dort einen Knoten hinzuzufügen; doppelklicken Sie auf einen Knoten, um ihn zu löschen." # mt
hintstep.shape.5 = "Ziehen Sie bei einem Rechteck einen Eckknoten, um die Ecken abzurunden. Ziehen Sie bei einer Ellipse den Knoten nach innen für einen Kreissektor oder nach außen für einen Bogen." # mt
hintstep.smooth.1 = "Wählen Sie eine Kurve aus und ziehen Sie an ihrem Umriss entlang: Wellen und überzählige Knoten werden dort geglättet, wo der Pinsel vorbeikommt." # mt
hintstep.smooth.2 = "Spitzengröße legt den Radius des Pinsels fest, Rate die Stärke der Glättung. In der Mitte der Spitze wirkt der Effekt am stärksten." # mt
hintstep.smear.1 = "Wählen Sie ein Objekt aus und ziehen Sie von innerhalb des Umrisses nach außen, um eine Ausbuchtung herauszuziehen." # mt
hintstep.smear.2 = "Ziehen Sie von außerhalb des Umrisses nach innen, um eine Delle hineinzudrücken." # mt
hintstep.smear.3 = "Druck in der Eigenschaftsleiste legt fest, wie weit sich der Umriss bewegt, Spitzengröße den Radius des Pinsels." # mt
hintstep.twirl.1 = "Wählen Sie ein Objekt aus, setzen Sie die Spitze auf seinen Rand und halten Sie die Maustaste gedrückt: Der Umriss dreht sich zu einem Wirbel, der wächst, solange Sie gedrückt halten." # mt
hintstep.twirl.2 = "Wählen Sie in der Eigenschaftsleiste im oder gegen den Uhrzeigersinn, oder halten Sie Alt gedrückt, um andersherum zu drehen. Geschwindigkeit legt fest, wie schnell es sich dreht." # mt
hintstep.attract_repel.1 = "Wählen Sie ein Objekt aus und halten Sie die Maustaste gedrückt, während die Spitze über dem Umriss liegt: Anziehen zieht die Knoten zum Mauszeiger." # mt
hintstep.attract_repel.2 = "Wählen Sie Abstoßen oder halten Sie Alt gedrückt, um die Knoten vom Mauszeiger wegzuschieben." # mt
hintstep.attract_repel.3 = "Spitzengröße legt den veränderten Bereich fest, Geschwindigkeit, wie schnell er sich ändert. Bleibt der Mauszeiger stehen, geht es weiter." # mt
hintstep.smudge.1 = "Wählen Sie ein Objekt aus und ziehen Sie über seinen Umriss: Der Umriss wird gleichmäßig mit dem Zug mitgezogen." # mt
hintstep.smudge.2 = "Druck legt fest, wie weit der Umriss gezogen wird, Spitzengröße den Radius des Pinsels." # mt
hintstep.roughen.1 = "Wählen Sie ein Objekt aus und ziehen Sie an seinem Umriss entlang: Wo Sie ziehen, entstehen gezackte Spitzen." # mt
hintstep.roughen.2 = "Frequenz legt fest, wie viele Zacken entstehen, Zackengröße, wie hoch sie sind." # mt
hintstep.variable_outline.1 = "Wählen Sie ein Objekt mit Umriss aus und ziehen Sie quer über den Umriss: Ein Breitenknoten wird hinzugefügt und der Umriss wird auf beiden Seiten bis zum Mauszeiger breiter." # mt
hintstep.variable_outline.2 = "Fügen Sie auf die gleiche Weise weitere Breitenknoten hinzu. Die Breite ändert sich gleichmäßig von einem Knoten zum nächsten." # mt
hintstep.variable_outline.3 = "Halten Sie zu Beginn des Ziehens Umschalt oder Alt gedrückt, um nur die Seite zu ändern, auf der der Mauszeiger ist." # mt
hintstep.variable_outline.4 = "Klicken Sie auf einen Knoten, um in der Eigenschaftsleiste seine linke und rechte Breite einzugeben; Entf entfernt ihn." # mt
hintstep.crop.1 = "Ziehen Sie ein Rechteck über den Teil, den Sie behalten möchten. Die Zeichnung außerhalb wird abgedunkelt." # mt
hintstep.crop.2 = "Ziehen Sie innerhalb des Bereichs, um ihn zu verschieben, oder ziehen Sie einen seiner Griffe, um seine Größe zu ändern." # mt
hintstep.crop.3 = "Doppelklicken Sie in den Bereich oder drücken Sie die Eingabetaste, um zuzuschneiden. Esc bricht ab." # mt
hintstep.knife.1 = "Wählen Sie in der Eigenschaftsleiste Zwei-Punkt-Linie oder Freihand und ziehen Sie quer durch ein Objekt, um es zu schneiden." # mt
hintstep.knife.2 = "Die Teile werden zu eigenen Objekten, die Sie mit dem Auswahlwerkzeug auseinanderschieben können." # mt
hintstep.knife.3 = "Teilen lässt eine haarfeine Linie zwischen den Teilen; Abstand entfernt einen Streifen in der eingestellten Breite." # mt
hintstep.segment_delete.1 = "Klicken Sie auf ein Umrissstück zwischen zwei Kreuzungen, um es zu löschen." # mt
hintstep.segment_delete.2 = "Ziehen Sie ein Rechteck über Umrisse, um alle Stücke zu löschen, die es berührt." # mt
hintstep.eraser.1 = "Ziehen Sie über ein Objekt, um die überstrichenen Teile wegzuradieren. Ein Klick radiert einen Punkt." # mt
hintstep.eraser.2 = "Legen Sie in der Eigenschaftsleiste die Stärke und eine runde oder eckige Spitze fest." # mt
hintstep.eraser.3 = "Doppelklicken Sie mit dem Werkzeug auf ein Objekt, um es ganz zu löschen." # mt
hintstep.zoom.1 = "Klicken Sie, um an dieser Stelle zu vergrößern." # mt
