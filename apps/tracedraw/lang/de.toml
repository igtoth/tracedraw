hinttopic.connector_lines = "Verbindungslinien verbinden Objekte und bleiben verbunden, wenn die Objekte bewegt werden."
hinttopic.dimension_lines = "Maßlinien zeigen die Größe von Objekten und Abstände oder Winkel zwischen Punkten; sie aktualisieren sich, wenn sich die Objekte ändern."
hinttopic.effects = "Objekten mit Schatten, Konturen, Überblendungen, Verzerrungen, Hüllen, Extrusionen und Transparenz Tiefe und Bewegung geben."
hinttopic.fill = "Objekte mit einheitlichen Farben, Verläufen, Mustern, Texturen und Gittern füllen. **Klicken** Sie auf eine Palettenfarbe, um die Auswahl zu füllen."
hinttopic.help = "Drücken Sie **F1** für Hilfe, lassen Sie diesen Bereich **Hinweise** beim Arbeiten geöffnet und sehen Sie sich den Begrüßungsbildschirm zum Einstieg an."
hinttopic.lines = "Das Flyout der **Kurven**-Werkzeuge enthält die Werkzeuge zum Zeichnen von Linien, freihändig oder präzise, gerade oder gekrümmt."
hinttopic.move_scale = "Ein ausgewähltes Objekt ziehen, um es zu verschieben; **Strg** hält es waagerecht oder senkrecht. Einen **Eckgriff** ziehen, um proportional zu skalieren, einen **Seitengriff**, um zu dehnen; **Umschalt** skaliert von der Mitte. Die Pfeiltasten verschieben die Auswahl schrittweise."
hinttopic.outline = "Breite, Farbe und Stil von Konturen festlegen. Mit **Rechtsklick** auf eine Palettenfarbe die Kontur der Auswahl färben."
hinttopic.rotate_skew = "Ein ausgewähltes Objekt erneut anklicken, um die Dreh- und Neigegriffe zu zeigen. Einen **Eckpfeil** zum Drehen und einen **Seitenpfeil** zum Neigen ziehen; **Strg** dreht in 15-Grad-Schritten. Die Mittelmarke ziehen, um den Drehpunkt zu ändern."
hinttopic.select = "Ein Objekt anklicken, um es auszuwählen. **Umschalt**+Klick fügt Objekte hinzu oder entfernt sie; auf einer leeren Fläche ziehen wählt die Objekte im Rahmen; **Alt**+Klick wählt das darunterliegende Objekt; **Strg**+Klick wählt ein Objekt in einer Gruppe."
hinttopic.shape_objects = "Die Form von Objekten durch Bearbeiten der Knoten, Verzerren der Kontur oder Schneiden und Radieren ändern."
hinttopic.shapes = "Rechtecke, Ellipsen, Polygone, Sterne, Spiralen, Raster und fertige Formen durch diagonales Ziehen zeichnen. **Strg** behält die Proportionen; **Umschalt** zeichnet von der Mitte."
hinttopic.text = "Mit dem **Text**-Werkzeug klicken für Grafiktext oder ziehen für Mengentext in einem Rahmen. In den Text klicken, um ihn zu bearbeiten."
