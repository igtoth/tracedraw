welcome.choose_workspace = "Arbeitsbereich wählen"
welcome.get_started = "Erste Schritte"
welcome.learn = "Lernen"
welcome.learn_1_body = "Wählen Sie ein Hilfsmittel aus der Hilfsmittelpalette (Schaltfläche gedrückt halten für das Flyout) und ziehen Sie auf der Seite. Strg beschränkt, Umschalt zeichnet von der Mitte aus."
welcome.learn_1_title = "Zeichnen"
welcome.learn_2_body = "Klicken zum Auswählen, erneut klicken für Dreh- und Neigungsgriffe, Ecken ziehen zum Skalieren. Pfeiltasten verschieben schrittweise; Umschalt+Pfeiltasten um das Zehnfache."
welcome.learn_2_title = "Auswählen und transformieren"
welcome.learn_3_body = "Linksklick auf eine Palettenfarbe für die Füllung, Rechtsklick für den Umriss. Der Bereich Eigenschaften bearbeitet Verläufe, Muster, Texturen und Gitter."
welcome.learn_3_title = "Füllungen und Umrisse"
welcome.learn_4_body = "Das Hilfsmittel Form (F10) bearbeitet Knoten: Doppelklick auf ein Segment fügt einen Knoten hinzu, Doppelklick auf einen Knoten löscht ihn; die Eigenschaftsleiste bietet spitz, glatt und symmetrisch."
welcome.learn_4_title = "Knoten"
welcome.learn_5_body = "Effekte bleiben bearbeitbar: Den Bereich des Effekts im Menü Effekte öffnen, Werte ändern, und das Objekt wird aktualisiert. Effekte reduzieren macht sie dauerhaft."
welcome.learn_5_title = "Effekte"
welcome.my_templates = "Meine Vorlagen"
welcome.new_document = "Neues Dokument"
welcome.new_from_template = "Neu aus Vorlage"
welcome.news_1_body = "Kontur, Überblendung, Hülle, Perspektive, Extrusion, Abschrägung, Blockschatten, Linse und ungleichmäßige Transparenz sind jetzt live: Jederzeit in ihren Bereichen änderbar."
welcome.news_1_title = "Live-Effekte"
welcome.news_2_body = "Mengentext mit Spalten, Aufzählungszeichen, Initialen, Tabulatoren, Silbentrennung, Laufweite, Basislinienversatz, OpenType-Funktionen und Text an Strecke."
welcome.news_2_title = "Text-Engine"
welcome.news_3_body = "Die Benutzeroberfläche ist auf Englisch, Chinesisch, Hindi, Spanisch, Französisch, Arabisch, Bengalisch, Russisch, brasilianischem Portugiesisch, Indonesisch, Deutsch und Japanisch verfügbar. Ändern Sie sie unter Extras > Optionen > Arbeitsbereich."
