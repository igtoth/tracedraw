hinttopic.connector_lines = "Bağlantı çizgileri nesneleri birleştirir ve nesneler taşındığında bağlı kalır."
hinttopic.dimension_lines = "Ölçü çizgileri nesnelerin boyutunu ve noktalar arasındaki uzaklığı veya açıyı gösterir; nesneler değiştiğinde güncellenir."
hinttopic.effects = "Gölgeler, konturlar, karışımlar, bozmalar, zarflar, ekstrüzyonlar ve saydamlıkla nesnelere derinlik ve hareket katın."
hinttopic.fill = "Nesneleri düz renkler, renk geçişleri, desenler, dokular ve ağlarla doldurun. Seçimi doldurmak için bir palet rengine **tıklayın**."
hinttopic.help = "Yardım için **F1** tuşuna basın, çalışırken bu **İpuçları** panelini açık tutun ve başlangıç için Hoş Geldiniz ekranına bakın."
hinttopic.lines = "**Eğri** araçları açılır menüsü, serbest veya hassas, düz veya eğri çizgiler çizme araçlarını içerir."
hinttopic.move_scale = "Seçili bir nesneyi taşımak için sürükleyin; **Ctrl** onu yatay veya dikey bir çizgi üzerinde tutar. Orantılı ölçeklemek için bir **köşe tutamacını**, uzatmak için bir **kenar tutamacını** sürükleyin; **Shift** merkezden ölçekler. Ok tuşları seçimi küçük adımlarla kaydırır."
hinttopic.outline = "Anahatların genişliğini, rengini ve stilini ayarlayın. Seçimin anahattını renklendirmek için bir palet rengine **sağ tıklayın**."
hinttopic.rotate_skew = "Döndürme ve eğme tutamaçlarını göstermek için seçili bir nesneye yeniden tıklayın. Döndürmek için bir **köşe okunu**, eğmek için bir **kenar okunu** sürükleyin; **Ctrl** 15 derecelik adımlarla döndürür. Döndürme merkezini değiştirmek için merkez işaretini sürükleyin."
hinttopic.select = "Bir nesneyi seçmek için üzerine tıklayın. **Shift**+tıklama nesne ekler veya çıkarır; seçim çerçevesinin içindeki nesneleri seçmek için boş bir alanda sürükleyin; **Alt**+tıklama alttaki nesneyi seçer; **Ctrl**+tıklama bir grubun içindeki nesneyi seçer."
hinttopic.shape_objects = "Nesnelerin düğümlerini düzenleyerek, anahatlarını bozarak ya da parçalarını keserek ve silerek şekillerini değiştirin."
hinttopic.shapes = "Çapraz sürükleyerek dikdörtgen, elips, çokgen, yıldız, sarmal, ızgara ve hazır şekiller çizin. **Ctrl** oranları korur; **Shift** merkezden çizer."
hinttopic.text = "Sanatsal metin eklemek için **Metin** aracıyla tıklayın veya çerçeve içinde paragraf metni eklemek için sürükleyin. Düzenlemek için metnin içine tıklayın."
