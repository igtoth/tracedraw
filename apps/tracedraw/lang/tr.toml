hintstep.pick.1 = "Seçmek için bir nesneye tıklayın. Çevresinde sekiz tutamaç belirir." # mt
hintstep.pick.2 = "Taşımak için nesneyi sürükleyin. Orantılı boyutlandırmak için bir köşe tutamacını, germek için bir kenar tutamacını sürükleyin." # mt
hintstep.pick.3 = "Döndürme tutamaçlarını göstermek için seçili nesneye yeniden tıklayın: döndürmek için bir köşe okunu, eğmek için bir kenar okunu sürükleyin." # mt
hintstep.pick.4 = "Tamamen içinde kalan her nesneyi seçmek için boş bir noktadan başlayarak nesnelerin çevresine bir çerçeve sürükleyin." # mt
hintstep.pick.5 = "Shift+tıklama bir nesneyi seçime ekler ya da çıkarır; Ctrl+tıklama bir grubun içindeki nesneyi seçer; Alt+tıklama alttaki nesneyi seçer." # mt
hintstep.freehand_pick.1 = "İstediğiniz nesnelerin çevresine bir döngü sürükleyin. Bıraktığınızda, tamamen döngünün içinde kalan her nesne seçilir." # mt
hintstep.freehand_pick.2 = "Döngünün dokunduğu her nesneyi seçmek için bırakırken Alt tuşunu basılı tutun." # mt
hintstep.freehand_pick.3 = "Seçime eklemek için Shift, döngü yerine dikdörtgen sürüklemek için Ctrl tuşunu basılı tutun. Seçili nesneler Seçim aracındaki gibi taşınır ve boyutlandırılır." # mt
hintstep.free_transform.1 = "Bir nesne seçin, Özellik Çubuğu'nda Serbest Döndürme'yi seçin ve sürükleyin: nesne bastığınız noktanın çevresinde döner." # mt
hintstep.free_transform.2 = "Serbest Açılı Yansıtma nesneyi, basılan noktadan işaretçiye uzanan çizgiye göre aynalar." # mt
hintstep.free_transform.3 = "Serbest Ölçekleme nesneyi basılan noktadan boyutlandırır, Serbest Eğme ise onu eğer." # mt
hintstep.free_transform.4 = "Tek bir sürükleme için ölçeklemek üzere Alt, eğmek için Ctrl, yansıtmak için Shift tuşunu basılı tutun. Kopyaya Uygula açıkken sürükleme bir kopyayı dönüştürür." # mt
hintstep.shape.1 = "Düğümlerini göstermek için bir eğriye tıklayın, ardından taşımak için bir düğümü sürükleyin." # mt
hintstep.shape.2 = "Kontrol tutamaçlarını göstermek için bir düğüme tıklayın ve eğrinin bükümünü değiştirmek için bir tutamacı sürükleyin." # mt
hintstep.shape.3 = "Bükmek için bir parçayı sürükleyin. Düz bir parça eğri olur." # mt
hintstep.shape.4 = "Oraya düğüm eklemek için bir parçaya çift tıklayın; silmek için bir düğüme çift tıklayın." # mt
hintstep.shape.5 = "Bir dikdörtgende köşeleri yuvarlatmak için bir köşe düğümünü sürükleyin. Bir elipste dilim için düğümü içeri, yay için dışarı sürükleyin." # mt
hintstep.smooth.1 = "Bir eğri seçin ve anahattı boyunca sürükleyin: fırçanın geçtiği yerde dalgalanmalar ve fazla düğümler düzgünleşir." # mt
hintstep.smooth.2 = "Uç boyutu fırçanın yarıçapını, Oran ne kadar güçlü düzgünleştirdiğini belirler. Etki ucun ortasında en güçlüdür." # mt
hintstep.smear.1 = "Bir uzantı çekip çıkarmak için bir nesne seçin ve anahattın içinden dışarı doğru sürükleyin." # mt
hintstep.smear.2 = "Bir çukur itmek için anahattın dışından içeri doğru sürükleyin." # mt
hintstep.smear.3 = "Özellik Çubuğu'ndaki Basınç anahattın ne kadar kaydığını, Uç boyutu fırçanın yarıçapını belirler." # mt
hintstep.twirl.1 = "Bir nesne seçin, ucu kenarına getirin ve fare düğmesini basılı tutun: anahat, basılı tuttuğunuz sürece büyüyen bir girdaba dönüşür." # mt
hintstep.twirl.2 = "Özellik Çubuğu'nda saat yönünü ya da tersini seçin veya öbür yöne döndürmek için Alt tuşunu basılı tutun. Hız ne kadar hızlı döndüğünü belirler." # mt
hintstep.attract_repel.1 = "Bir nesne seçin ve uç anahattın üzerindeyken fare düğmesini basılı tutun: Çek, düğümleri işaretçiye doğru çeker." # mt
hintstep.attract_repel.2 = "Düğümleri işaretçiden uzağa itmek için İt'i seçin ya da Alt tuşunu basılı tutun." # mt
hintstep.attract_repel.3 = "Uç boyutu değişen alanı, Hız ne kadar hızlı değiştiğini belirler. İşaretçiyi sabit tutunca etki sürer." # mt
hintstep.smudge.1 = "Bir nesne seçin ve anahattın üzerinden sürükleyin: anahat sürüklemeyle birlikte yumuşakça çekilir." # mt
hintstep.smudge.2 = "Basınç anahattın ne kadar çekildiğini, Uç boyutu fırçanın yarıçapını belirler." # mt
hintstep.roughen.1 = "Bir nesne seçin ve anahattı boyunca sürükleyin: sürüklediğiniz yerde tırtıklı sivri uçlar belirir." # mt
hintstep.roughen.2 = "Sıklık kaç sivri uç olacağını, Sivri uç boyutu ne kadar uzun olduklarını belirler." # mt
hintstep.variable_outline.1 = "Anahattı olan bir nesne seçin ve anahattın üzerinden sürükleyin: bir genişlik düğümü eklenir ve anahat her iki yanda işaretçiye kadar genişler." # mt
hintstep.variable_outline.2 = "Aynı şekilde başka genişlik düğümleri ekleyin. Genişlik bir düğümden ötekine yumuşakça değişir." # mt
