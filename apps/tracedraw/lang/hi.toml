hint.home_intro = "विषय देखने के लिए किसी टूल से कोई क्रिया करें या नीचे दी गई सूची से विषय चुनें।"
hint.interactive_fill = "डिफ़ॉल्ट फ़िल लगाने के लिए ऑब्जेक्ट पर क्लिक करें; रैखिक ग्रेडिएंट फ़िल के लिए उस पर खींचें।"
hint.learn_more = "और जानें"
hint.palette_footer = "पैलेट: बायाँ क्लिक भरता है, दायाँ क्लिक आउटलाइन। तीर कुंजियाँ चयन को खिसकाती हैं।"
hint.pan = "दृश्य हिलाने के लिए खींचें। माउस का मध्य बटन किसी भी टूल में पैन करता है।"
hint.pick = "ऑब्जेक्ट चुनने के लिए उस पर क्लिक करें। घुमाने और तिरछा करने के हैंडल के लिए फिर क्लिक करें। आकार बदलने के लिए हैंडल खींचें; Shift+क्लिक चयन में जोड़ता है; खाली जगह पर खींचकर मार्की चुनें। शेप टूल पर जाने के लिए वक्र पर डबल-क्लिक करें।"
hint.polygon = "बनाने के लिए खींचें। प्रॉपर्टी बार पर बिंदुओं की संख्या सेट करें।"
hint.polyline = "बिंदु रखने के लिए क्लिक करें। डबल-क्लिक या Enter समाप्त करता है।"
hint.rectangle = "आयत बनाने के लिए खींचें। Ctrl वर्ग तक सीमित करता है। पृष्ठ-आकार के आयत के लिए टूल पर डबल-क्लिक करें।"
