hinttopic.connector_lines = "कनेक्टर रेखाएँ ऑब्जेक्ट जोड़ती हैं और ऑब्जेक्ट हिलने पर भी जुड़ी रहती हैं।"
hinttopic.dimension_lines = "आयाम रेखाएँ ऑब्जेक्ट का आकार और बिंदुओं के बीच दूरी या कोण दिखाती हैं; ऑब्जेक्ट बदलने पर अपडेट होती हैं।"
hinttopic.effects = "छाया, समोच्च, मिश्रण, विकृति, आवरण, एक्सट्रूज़न और पारदर्शिता से ऑब्जेक्ट को गहराई और गति दें।"
hinttopic.fill = "ऑब्जेक्ट को एकसमान रंग, ग्रेडिएंट, पैटर्न, टेक्सचर और मेश से भरें। चयन भरने के लिए पैलेट रंग पर **क्लिक** करें।"
hinttopic.help = "सहायता के लिए **F1** दबाएँ, काम करते समय यह **संकेत** पैनल खुला रखें, और शुरुआत के लिए स्वागत स्क्रीन देखें।"
hinttopic.lines = "**वक्र** टूल फ़्लायआउट में रेखाएँ बनाने के टूल हैं: फ़्रीहैंड या सटीक, सीधी या घुमावदार।"
hinttopic.move_scale = "चुना ऑब्जेक्ट हिलाने के लिए खींचें; **Ctrl** उसे क्षैतिज या ऊर्ध्वाधर रखता है। **कोने का हैंडल** अनुपात में स्केल करता है और **बगल का हैंडल** खींचता है; **Shift** केंद्र से स्केल करता है। तीर कुंजियाँ चयन को खिसकाती हैं।"
hinttopic.outline = "रूपरेखा की चौड़ाई, रंग और शैली सेट करें। चयन की रूपरेखा रंगने के लिए पैलेट के रंग पर **राइट-क्लिक** करें।"
hinttopic.rotate_skew = "घुमाने और तिरछा करने के हैंडल दिखाने के लिए चुने ऑब्जेक्ट पर फिर क्लिक करें। **कोने का तीर** घुमाता है और **बगल का तीर** तिरछा करता है; **Ctrl** 15 डिग्री के चरणों में घुमाता है। घुमाव केंद्र बदलने के लिए केंद्र चिह्न खींचें।"
hinttopic.select = "ऑब्जेक्ट चुनने के लिए उस पर क्लिक करें। **Shift**+क्लिक ऑब्जेक्ट जोड़ता या हटाता है; खाली जगह पर खींचना घेरे के अंदर के ऑब्जेक्ट चुनता है; **Alt**+क्लिक नीचे वाला चुनता है; **Ctrl**+क्लिक समूह के अंदर का ऑब्जेक्ट चुनता है।"
hinttopic.shape_objects = "नोड संपादित करके, रूपरेखा विकृत करके या हिस्से काटकर और मिटाकर ऑब्जेक्ट का आकार बदलें।"
hinttopic.shapes = "तिरछा खींचकर आयत, दीर्घवृत्त, बहुभुज, तारे, सर्पिल, ग्रिड और तैयार आकृतियाँ बनाएँ। **Ctrl** अनुपात बनाए रखता है; **Shift** केंद्र से बनाता है।"
hinttopic.text = "कलात्मक टेक्स्ट जोड़ने के लिए **टेक्स्ट** टूल से क्लिक करें, या फ़्रेम में अनुच्छेद टेक्स्ट के लिए खींचें। संपादित करने के लिए टेक्स्ट के अंदर क्लिक करें।"
