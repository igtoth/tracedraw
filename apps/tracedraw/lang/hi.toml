welcome.new_document = "नया दस्तावेज़"
welcome.new_from_template = "टेम्पलेट से नया"
welcome.news_1_body = "कंटूर, ब्लेंड, एनवेलप, परिप्रेक्ष्य, एक्सट्रूड, बेवल, ब्लॉक शैडो, लेंस और असमान पारदर्शिता अब लाइव हैं: उन्हें कभी भी उनके डॉकर से बदलें।"
welcome.news_1_title = "लाइव प्रभाव"
welcome.news_2_body = "कॉलम, बुलेट, ड्रॉप कैप, टैब, हाइफ़नेशन, ट्रैकिंग, बेसलाइन शिफ़्ट, OpenType सुविधाओं और पाथ पर टेक्स्ट के साथ पैराग्राफ़ टेक्स्ट।"
welcome.news_2_title = "टेक्स्ट इंजन"
welcome.news_3_body = "इंटरफ़ेस अंग्रेज़ी, चीनी, हिन्दी, स्पेनिश, फ़्रेंच, अरबी, बांग्ला, रूसी, ब्राज़ीलियाई पुर्तगाली, इंडोनेशियाई, जर्मन और जापानी में उपलब्ध है। इसे टूल > विकल्प > कार्यस्थान में बदलें।"
welcome.news_3_title = "बारह भाषाएँ"
