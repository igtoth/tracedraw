welcome.learn_1_title = "चित्र बनाना"
welcome.learn_2_body = "चुनने के लिए क्लिक करें, घुमाने और तिरछा करने के हैंडल के लिए फिर क्लिक करें, आकार बदलने के लिए कोने खींचें। तीर कुंजियाँ नज करती हैं; Shift+तीर दस गुना अधिक।"
welcome.learn_2_title = "चयन और रूपांतरण"
welcome.learn_3_body = "भराव के लिए पैलेट के रंग पर बायाँ क्लिक, आउटलाइन के लिए दायाँ क्लिक करें। गुण डॉकर फ़ाउंटेन, पैटर्न, टेक्सचर और मेश भराव संपादित करता है।"
welcome.learn_3_title = "भराव और आउटलाइन"
welcome.learn_4_body = "शेप टूल (F10) नोड संपादित करता है: नोड जोड़ने के लिए खंड पर डबल-क्लिक करें, नोड हटाने के लिए उस पर डबल-क्लिक करें, कस्प, स्मूद और सममित के लिए प्रॉपर्टी बार का उपयोग करें।"
welcome.learn_4_title = "नोड"
welcome.learn_5_body = "प्रभाव संपादन योग्य रहते हैं: प्रभाव मेनू से प्रभाव का डॉकर खोलें, मान बदलें और ऑब्जेक्ट अद्यतन हो जाता है। प्रभाव समतल करें उन्हें स्थायी करता है।"
welcome.learn_5_title = "प्रभाव"
