web.notice_text = "यह डेस्कटॉप ऐप वाला ही Rust प्रोग्राम है, WebAssembly में कंपाइल किया हुआ ताकि आप बिना कुछ इंस्टॉल किए इसे आज़मा सकें। ब्राउज़र धीमा होता है: बड़े ड्रॉइंग, भारी इफ़ेक्ट और बड़ी फ़ाइलें ज़्यादा समय लेती हैं, केवल साथ आए फ़ॉन्ट उपलब्ध हैं, और फ़ाइलें अपलोड से खुलती हैं और डाउनलोड के रूप में सहेजी जाती हैं। असली काम और बड़ी फ़ाइलों के लिए Windows, macOS या Linux का ऐप इस्तेमाल करें: यह नेटिव रूप से, पूरी गति से चलता है।"
web.notice_download = "डेस्कटॉप ऐप डाउनलोड करें"
