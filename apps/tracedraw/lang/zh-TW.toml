hinttopic.help = "按 **F1** 取得說明，工作時讓這個**提示**面板保持開啟，並參閱歡迎畫面開始使用。"
hinttopic.lines = "**曲線**工具展開選單包含繪製線條的工具，可手繪或精確繪製，可畫直線或曲線。"
hinttopic.move_scale = "拖曳選取的物件即可移動；按住 **Ctrl** 可讓它保持在水平或垂直線上。拖曳**角落控點**可等比例縮放，拖曳**邊控點**可延展；按住 **Shift** 會從中心縮放。方向鍵可微移選取範圍。"
hinttopic.outline = "設定外框的寬度、色彩與樣式。在調色盤色彩上**按一下右鍵**，即可為選取範圍的外框上色。"
hinttopic.rotate_skew = "再按一下選取的物件，即可顯示旋轉與傾斜控點。拖曳**角落箭頭**可旋轉，拖曳**邊箭頭**可傾斜；按住 **Ctrl** 會以 15 度為間隔旋轉。拖曳中心標記可變更旋轉中心。"
hinttopic.select = "按一下物件即可選取。**Shift**+按一下可新增或移除物件；在空白處拖曳可選取圈選框內的物件；**Alt**+按一下可選取下方的物件；**Ctrl**+按一下可選取群組內的物件。"
hinttopic.shape_objects = "編輯節點、扭曲外框，或切割並擦除部分區域，以變更物件的形狀。"
hinttopic.shapes = "以對角拖曳的方式繪製矩形、橢圓形、多邊形、星形、螺旋形、格點與現成形狀。按住 **Ctrl** 可保持比例；按住 **Shift** 會從中心繪製。"
hinttopic.text = "使用**文字**工具按一下可新增美工文字，拖曳則可在框架中新增段落文字。在文字內按一下即可編輯。"
