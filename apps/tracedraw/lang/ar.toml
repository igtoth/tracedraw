hinttopic.effects = "امنح الكائنات عمقًا وحركة بالظلال والمحيطات والمزج والتشويه والأغلفة والبثق والشفافية."
hinttopic.fill = "املأ الكائنات بألوان موحدة وتدرجات وأنماط ومواد وشبكات. **انقر** لونًا في اللوحة لتعبئة التحديد."
hinttopic.help = "اضغط **F1** للمساعدة، وأبقِ لوحة **التلميحات** مفتوحة أثناء العمل، وراجع شاشة الترحيب للبدء."
hinttopic.lines = "تضم مجموعة أدوات **المنحنى** أدوات رسم الخطوط، الحرة أو الدقيقة، المستقيمة أو المنحنية."
hinttopic.move_scale = "اسحب الكائن المحدد لنقله؛ **Ctrl** يبقيه أفقيًا أو رأسيًا. اسحب **مقبض الزاوية** للتحجيم بالتناسب و**المقبض الجانبي** للمط؛ **Shift** يحجّم من المركز. مفاتيح الأسهم تزيح التحديد."
hinttopic.outline = "حدد عرض المخططات ولونها ونمطها. **انقر بزر الماوس الأيمن** على لون في اللوحة لتلوين مخطط التحديد."
hinttopic.rotate_skew = "انقر الكائن المحدد مرة أخرى لإظهار مقابض التدوير والإمالة. اسحب **سهم الزاوية** للتدوير و**السهم الجانبي** للإمالة؛ **Ctrl** يدور بخطوات 15 درجة. اسحب علامة المركز لتغيير مركز التدوير."
hinttopic.select = "انقر كائنًا لتحديده. **Shift**+نقرة يضيف الكائنات أو يزيلها؛ السحب على منطقة فارغة يحدد الكائنات داخل الإطار؛ **Alt**+نقرة يحدد الكائن الأسفل؛ **Ctrl**+نقرة يحدد كائنًا داخل مجموعة."
hinttopic.shape_objects = "غيّر شكل الكائنات بتحرير العقد أو تشويه المخطط أو قطع أجزاء منها ومسحها."
hinttopic.shapes = "ارسم المستطيلات والأشكال البيضاوية والمضلعات والنجوم واللوالب والشبكات والأشكال الجاهزة بالسحب قطريًا. **Ctrl** يحافظ على النسب؛ **Shift** يرسم من المركز."
hinttopic.text = "انقر بأداة **النص** لإضافة نص فني، أو اسحب لإضافة نص فقرة في إطار. انقر داخل النص لتحريره."
