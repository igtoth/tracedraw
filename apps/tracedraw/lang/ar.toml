welcome.new_from_template = "جديد من قالب"
welcome.news_1_body = "الحد والمزج والغلاف والمنظور والبثق والشطب والظل الكتلي والعدسة والشفافية غير المنتظمة أصبحت حية الآن: غيّرها في أي وقت من نوافذها."
welcome.news_1_title = "تأثيرات حية"
welcome.news_2_body = "نص فقرات مع أعمدة وتعداد نقطي وأحرف استهلالية وعلامات جدولة ووصل بالواصلة وتباعد أحرف وإزاحة الخط الأساسي وميزات OpenType ونص على مسار."
welcome.news_2_title = "محرك النص"
welcome.news_3_body = "الواجهة متوفرة بالإنجليزية والصينية والهندية والإسبانية والفرنسية والعربية والبنغالية والروسية والبرتغالية البرازيلية والإندونيسية والألمانية واليابانية. غيّرها من أدوات > خيارات > مساحة العمل."
