welcome.get_started = "البدء"
welcome.learn = "تعلّم"
welcome.learn_1_body = "اختر أداة من صندوق الأدوات (اضغط مطولاً على زر لفتح قائمته المنبثقة) واسحب على الصفحة. اضغط Ctrl للتقييد، وShift للرسم من المركز."
welcome.learn_1_title = "الرسم"
welcome.learn_2_body = "انقر للتحديد، وانقر مرة أخرى لمقابض التدوير والانحراف، واسحب الزوايا لتغيير الحجم. مفاتيح الأسهم تدفع الكائن؛ Shift+الأسهم تدفعه عشر مرات أكثر."
welcome.learn_2_title = "التحديد والتحويل"
welcome.learn_3_body = "انقر بالزر الأيسر على لون في اللوحة للتعبئة، وبالزر الأيمن للمحيط. تحرر نافذة الخصائص التعبئات المتدرجة والنمطية والنسيجية والشبكية."
welcome.learn_3_title = "التعبئات والمحيطات"
welcome.learn_4_body = "تحرر أداة الشكل (F10) العقد: انقر نقراً مزدوجاً على مقطع لإضافة عقدة، وانقر نقراً مزدوجاً على عقدة لحذفها، واستخدم شريط الخصائص للعقد الحادة والناعمة والمتناظرة."
welcome.learn_4_title = "العقد"
welcome.learn_5_body = "تبقى التأثيرات قابلة للتحرير: افتح نافذة التأثير من قائمة التأثيرات، وغيّر القيم فيتحدث الكائن. تسطيح التأثيرات يثبّتها."
