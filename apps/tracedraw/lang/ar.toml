web.notice_text = "هذا هو برنامج Rust نفسه الذي يعمل كتطبيق سطح المكتب، مُجمَّعًا إلى WebAssembly لتجربته دون تثبيت أي شيء. المتصفح أبطأ: الرسومات الكبيرة والتأثيرات الثقيلة والملفات الكبيرة تستغرق وقتًا أطول، ولا تتوفر إلا الخطوط المرفقة، وتُفتح الملفات بالرفع وتُحفظ كتنزيلات. للعمل الفعلي والملفات الكبيرة استخدم تطبيق Windows أو macOS أو Linux: يعمل أصليًا وبكامل سرعته."
