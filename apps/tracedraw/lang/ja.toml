hintstep.pick.3 = "選択中のオブジェクトをもう一度クリックすると回転ハンドルが表示されます。角の矢印をドラッグすると回転、辺の矢印をドラッグすると傾斜します。" # mt
hintstep.pick.4 = "何もない場所からオブジェクトを囲むように枠をドラッグすると、枠の中に完全に入ったオブジェクトがすべて選択されます。" # mt
hintstep.pick.5 = "Shift+クリックで選択に追加または解除、Ctrl+クリックでグループ内のオブジェクトを選択、Alt+クリックで下にあるオブジェクトを選択します。" # mt
hintstep.freehand_pick.1 = "選択したいオブジェクトを囲むようにループをドラッグします。ボタンを放すと、ループ内に完全に入ったオブジェクトがすべて選択されます。" # mt
hintstep.freehand_pick.2 = "放すときに Alt キーを押していると、ループが触れたオブジェクトがすべて選択されます。" # mt
hintstep.freehand_pick.3 = "Shift キーを押すと選択に追加、Ctrl キーを押すとループの代わりに長方形をドラッグします。選択したオブジェクトは選択ツールと同じように移動やサイズ変更ができます。" # mt
hintstep.free_transform.1 = "オブジェクトを選択し、プロパティバーで自由回転を選んでドラッグします。押した点を中心にオブジェクトが回転します。" # mt
