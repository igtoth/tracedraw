hintstep.free_transform.3 = "自由拡大縮小は押した点を基準にサイズを変え、自由傾斜はオブジェクトを傾けます。" # mt
hintstep.free_transform.4 = "1 回のドラッグの間、Alt キーで拡大縮小、Ctrl キーで傾斜、Shift キーで反転になります。複製に適用がオンのときは、コピーが変形されます。" # mt
