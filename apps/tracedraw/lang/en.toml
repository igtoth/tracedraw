welcome.choose_workspace = "Choose a workspace"
welcome.get_started = "Get Started"
welcome.learn = "Learn"
welcome.learn_1_body = "Pick a tool from the toolbox (hold a button for its flyout) and drag on the page. Hold Ctrl to constrain, Shift to draw from the center."
welcome.learn_1_title = "Drawing"
welcome.learn_2_body = "Click to select, click again for rotate and skew handles, drag corners to scale. Arrow keys nudge; Shift+arrows nudge ten times further."
welcome.learn_2_title = "Selecting and transforming"
welcome.learn_3_body = "Left-click a palette colour for the fill, right-click for the outline. The Properties docker edits fountain, pattern, texture and mesh fills."
welcome.learn_3_title = "Fills and outlines"
welcome.learn_4_body = "The Shape tool (F10) edits nodes: double-click a segment to add a node, double-click a node to delete it, use the property bar for cusp, smooth and symmetrical."
welcome.learn_4_title = "Nodes"
welcome.learn_5_body = "Effects stay editable: open the effect's docker from the Effects menu, change the values and the object updates. Flatten Effects bakes them."
welcome.learn_5_title = "Effects"
welcome.my_templates = "My templates"
welcome.new_document = "New Document"
welcome.new_from_template = "New from Template"
welcome.news_1_body = "Contour, blend, envelope, perspective, extrude, bevel, block shadow, lens and non-uniform transparency are now live: change them any time from their dockers."
welcome.news_1_title = "Live effects"
welcome.news_2_body = "Paragraph text with columns, bullets, drop caps, tabs, hyphenation, tracking, baseline shift, OpenType features and text on a path."
welcome.news_2_title = "Text engine"
welcome.news_3_body = "The interface is available in English, Chinese, Hindi, Spanish, French, Arabic, Bengali, Russian, Brazilian Portuguese, Indonesian, German and Japanese. Change it under Tools > Options > Workspace."
welcome.news_3_title = "Twelve languages"
