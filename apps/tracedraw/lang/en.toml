hinttopic.move_scale = "Drag a selected object to move it; **Ctrl** keeps it on a horizontal or vertical line. Drag a **corner handle** to scale it proportionally and a **side handle** to stretch it; **Shift** scales from the center. The arrow keys nudge the selection."
hinttopic.outline = "Set the width, color and style of outlines. **Right-click** a palette color to color the outline of the selection."
hinttopic.rotate_skew = "Click a selected object again to show the rotation and skew handles. Drag a **corner arrow** to rotate and a **side arrow** to skew; **Ctrl** rotates in steps of 15 degrees. Drag the center marker to change the center of rotation."
hinttopic.select = "Click an object to select it. **Shift**+click adds or removes objects; drag on an empty area to select the objects inside the marquee; **Alt**+click selects the object underneath; **Ctrl**+click selects an object inside a group."
hinttopic.shape_objects = "Change the shape of objects by editing their nodes, distorting their outline, or cutting and erasing parts of them."
hinttopic.shapes = "Draw rectangles, ellipses, polygons, stars, spirals, grids and ready-made shapes by dragging diagonally. **Ctrl** keeps the proportions; **Shift** draws from the center."
hinttopic.text = "Click with the **Text** tool to add artistic text, or drag to add paragraph text in a frame. Click inside text to edit it."
