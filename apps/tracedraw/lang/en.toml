welcome.choose_workspace = "Choose a workspace"
welcome.get_started = "Get Started"
welcome.learn = "Learn"
welcome.learn_1_body = "Pick a tool from the toolbox (hold a button for its flyout) and drag on the page. Hold Ctrl to constrain, Shift to draw from the center."
welcome.learn_1_title = "Drawing"
welcome.learn_2_body = "Click to select, click again for rotate and skew handles, drag corners to scale. Arrow keys nudge; Shift+arrows nudge ten times further."
welcome.learn_2_title = "Selecting and transforming"
welcome.learn_3_body = "Left-click a palette colour for the fill, right-click for the outline. The Properties panel edits gradient, pattern, texture and mesh fills."
welcome.learn_3_title = "Fills and outlines"
welcome.learn_4_body = "The Shape tool (F10) edits nodes: double-click a segment to add a node, double-click a node to delete it, use the property bar for cusp, smooth and symmetrical."
welcome.learn_4_title = "Nodes"
welcome.learn_5_body = "Effects stay editable: open the effect's panel from the Effects menu, change the values and the object updates. Flatten Effects bakes them."
welcome.learn_5_title = "Effects"
welcome.my_templates = "My templates"
welcome.new_document = "New Document"
welcome.new_from_template = "New from Template"
welcome.news_1_body = "Contour, blend, envelope, extrude (now turning in 3D with several lights and a bevel), lens and the other effects stay live, and the Effects docker switches each one off and on and changes their order."
welcome.news_1_title = "Live effects"
welcome.news_2_body = "Named spot inks print on plates of their own, and a clip frame can be an opacity mask whose brightness decides how much of its contents shows."
welcome.news_2_title = "Spot colours and masks"
welcome.news_3_body = "The interface is available in eighteen languages. Change it under Tools > Options > Global > General."
welcome.news_3_title = "Eighteen languages"
