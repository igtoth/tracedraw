hintstep.zoom.3 = "Cliquez avec le bouton droit ou Maj+clic pour réduire. Double-cliquez sur le bouton de l'outil pour voir tous les objets." # mt
hintstep.pan.1 = "Faites glisser pour déplacer la vue dans n'importe quelle direction. Le dessin ne change pas." # mt
hintstep.pan.2 = "Avec n'importe quel outil, faites glisser avec le bouton du milieu de la souris pour déplacer la vue." # mt
hintstep.freehand.1 = "Faites glisser sur la page pour tracer une ligne là où passe le pointeur, et relâchez pour terminer." # mt
hintstep.freehand.2 = "Cliquez là où commence une ligne droite, puis là où elle finit. Maintenez Ctrl pour des pas de 15 degrés." # mt
