welcome.learn_1_body = "Choisissez un outil dans la boîte à outils (maintenez un bouton pour ouvrir son menu contextuel) et faites glisser sur la page. Maintenez Ctrl pour contraindre, Maj pour dessiner à partir du centre."
welcome.learn_1_title = "Dessiner"
welcome.learn_2_body = "Cliquez pour sélectionner, cliquez de nouveau pour afficher les poignées de rotation et d'inclinaison, faites glisser les angles pour mettre à l'échelle. Les touches fléchées déplacent ; Maj+flèches déplacent dix fois plus loin."
welcome.learn_2_title = "Sélectionner et transformer"
welcome.learn_3_body = "Clic gauche sur une couleur de la palette pour le fond, clic droit pour le contour. Le panneau Propriétés modifie les dégradés, motifs, textures et maillages."
welcome.learn_3_title = "Surfaces et contours"
welcome.learn_4_body = "L'outil Forme (F10) modifie les noeuds : double-cliquez sur un segment pour ajouter un noeud, double-cliquez sur un noeud pour le supprimer, utilisez la barre de propriétés pour angulaire, lisse et symétrique."
welcome.learn_4_title = "Noeuds"
welcome.learn_5_body = "Les effets restent modifiables : ouvrez le panneau de l'effet depuis le menu Effets, changez les valeurs et l'objet se met à jour. Aplatir les effets les fige."
