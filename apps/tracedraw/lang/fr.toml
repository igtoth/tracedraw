hintstep.pen.3 = "Cliquez sur le premier nœud pour fermer la courbe, ou double-cliquez ou appuyez sur Entrée pour terminer." # mt
hintstep.bspline.1 = "Cliquez pour placer les points de contrôle. La courbe les suit en douceur et reste toujours à l'intérieur." # mt
hintstep.bspline.2 = "Double-cliquez ou appuyez sur Entrée pour terminer, ou cliquez sur le premier point pour fermer la courbe en boucle." # mt
hintstep.polyline.1 = "Cliquez pour ajouter chaque angle : les segments droits se suivent l'un après l'autre." # mt
hintstep.polyline.2 = "Double-cliquez ou appuyez sur Entrée pour terminer, ou cliquez sur le premier nœud pour fermer la forme. Ctrl limite chaque segment à des pas de 15 degrés." # mt
