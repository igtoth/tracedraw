hintstep.rectangle.4 = "Double-cliquez sur le bouton de l'outil pour tracer un rectangle de la taille de la page." # mt
hintstep.three_point_rectangle.1 = "Faites glisser pour tracer la ligne de base, selon n'importe quel angle." # mt
hintstep.three_point_rectangle.2 = "Déplacez le pointeur pour régler la hauteur et cliquez." # mt
hintstep.ellipse.1 = "Faites glisser en diagonale pour tracer une ellipse." # mt
