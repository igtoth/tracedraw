# Hints panel: the steps of each tool's page (ui/hint_pics.rs)
hintstep.pick.1 = "Cliquez sur un objet pour le sélectionner. Huit poignées apparaissent autour de lui." # mt
hintstep.pick.2 = "Faites glisser l'objet pour le déplacer. Faites glisser une poignée d'angle pour le redimensionner proportionnellement, ou une poignée latérale pour l'étirer." # mt
hintstep.pick.3 = "Cliquez de nouveau sur l'objet sélectionné pour afficher les poignées de rotation : faites glisser une flèche d'angle pour le faire pivoter, une flèche latérale pour l'incliner." # mt
hintstep.pick.4 = "Tracez un cadre autour des objets en partant d'un endroit vide pour sélectionner tous ceux qui s'y trouvent entièrement." # mt
hintstep.pick.5 = "Maj+clic ajoute un objet à la sélection ou l'en retire ; Ctrl+clic sélectionne un objet dans un groupe ; Alt+clic sélectionne l'objet situé en dessous." # mt
hintstep.freehand_pick.1 = "Tracez une boucle autour des objets voulus. Au relâchement, tous les objets entièrement dans la boucle sont sélectionnés." # mt
hintstep.freehand_pick.2 = "Maintenez Alt en relâchant pour sélectionner tous les objets que la boucle touche." # mt
hintstep.freehand_pick.3 = "Maintenez Maj pour ajouter à la sélection, ou Ctrl pour tracer un rectangle au lieu d'une boucle. Les objets sélectionnés se déplacent et se redimensionnent comme avec l'outil Sélecteur." # mt
hintstep.free_transform.1 = "Sélectionnez un objet, choisissez Rotation libre dans la barre de propriétés et faites glisser : l'objet pivote autour du point où vous avez appuyé." # mt
hintstep.free_transform.2 = "Réflexion à angle libre crée le miroir de l'objet par rapport à la ligne qui va du point d'appui au pointeur." # mt
hintstep.free_transform.3 = "Mise à l'échelle libre redimensionne l'objet depuis le point d'appui, et Inclinaison libre l'incline." # mt
hintstep.free_transform.4 = "Maintenez Alt pour mettre à l'échelle, Ctrl pour incliner ou Maj pour refléter le temps d'un glissement. Avec Appliquer au double activé, le glissement transforme une copie." # mt
hintstep.shape.1 = "Cliquez sur une courbe pour afficher ses nœuds, puis faites glisser un nœud pour le déplacer." # mt
hintstep.shape.2 = "Cliquez sur un nœud pour afficher ses poignées de contrôle, et faites glisser une poignée pour changer la courbure." # mt
hintstep.shape.3 = "Faites glisser un segment pour le courber. Un segment droit devient courbe." # mt
hintstep.shape.4 = "Double-cliquez sur un segment pour y ajouter un nœud ; double-cliquez sur un nœud pour le supprimer." # mt
hintstep.shape.5 = "Sur un rectangle, faites glisser un nœud d'angle pour arrondir les coins. Sur une ellipse, faites glisser le nœud vers l'intérieur pour un secteur, vers l'extérieur pour un arc." # mt
hintstep.smooth.1 = "Sélectionnez une courbe et faites glisser le long du contour : les ondulations et les nœuds superflus sont lissés là où passe le pinceau." # mt
hintstep.smooth.2 = "Taille de la plume règle le rayon du pinceau et Taux la force du lissage. L'effet est le plus fort au centre de la plume." # mt
hintstep.smear.1 = "Sélectionnez un objet et faites glisser de l'intérieur du contour vers l'extérieur pour tirer une excroissance." # mt
hintstep.smear.2 = "Faites glisser de l'extérieur du contour vers l'intérieur pour enfoncer un creux." # mt
hintstep.smear.3 = "Pression dans la barre de propriétés règle de combien le contour se déplace, et Taille de la plume le rayon du pinceau." # mt
hintstep.twirl.1 = "Sélectionnez un objet, placez la plume sur son bord et maintenez le bouton de la souris : le contour forme un tourbillon qui grandit tant que vous maintenez." # mt
hintstep.twirl.2 = "Choisissez le sens horaire ou antihoraire dans la barre de propriétés, ou maintenez Alt pour tourner dans l'autre sens. Vitesse règle la rapidité de la rotation." # mt
hintstep.attract_repel.1 = "Sélectionnez un objet et maintenez le bouton de la souris avec la plume sur son contour : Attirer rapproche les nœuds du pointeur." # mt
hintstep.attract_repel.2 = "Choisissez Repousser, ou maintenez Alt, pour éloigner les nœuds du pointeur." # mt
hintstep.attract_repel.3 = "Taille de la plume règle la zone modifiée et Vitesse la rapidité du changement. Si le pointeur reste immobile, l'effet continue." # mt
hintstep.smudge.1 = "Sélectionnez un objet et faites glisser à travers son contour : le contour est entraîné en douceur avec le glissement." # mt
hintstep.smudge.2 = "Pression règle de combien le contour est entraîné, et Taille de la plume le rayon du pinceau." # mt
hintstep.roughen.1 = "Sélectionnez un objet et faites glisser le long de son contour : des pointes irrégulières apparaissent là où vous passez." # mt
hintstep.roughen.2 = "Fréquence règle le nombre de pointes, et Taille des pointes leur hauteur." # mt
hintstep.variable_outline.1 = "Sélectionnez un objet avec un contour et faites glisser à travers le contour : un nœud de largeur est ajouté et le contour s'élargit jusqu'au pointeur des deux côtés." # mt
hintstep.variable_outline.2 = "Ajoutez d'autres nœuds de largeur de la même façon. La largeur varie en douceur d'un nœud au suivant." # mt
hintstep.variable_outline.3 = "Maintenez Maj ou Alt en commençant à faire glisser pour ne modifier que le côté où se trouve le pointeur." # mt
hintstep.variable_outline.4 = "Cliquez sur un nœud pour saisir ses largeurs gauche et droite dans la barre de propriétés ; Suppr le supprime." # mt
hintstep.crop.1 = "Tracez un rectangle sur la partie à conserver. Le dessin hors du rectangle est assombri." # mt
hintstep.crop.2 = "Faites glisser à l'intérieur de la zone pour la déplacer, ou faites glisser l'une de ses poignées pour la redimensionner." # mt
hintstep.crop.3 = "Double-cliquez dans la zone ou appuyez sur Entrée pour recadrer. Échap annule." # mt
hintstep.knife.1 = "Choisissez Ligne à deux points ou À main levée dans la barre de propriétés, puis faites glisser à travers un objet pour le couper." # mt
hintstep.knife.2 = "Les morceaux deviennent des objets distincts que vous pouvez écarter avec l'outil Sélecteur." # mt
hintstep.knife.3 = "Diviser laisse un filet très fin entre les morceaux ; Écart retire une bande de la largeur indiquée." # mt
hintstep.segment_delete.1 = "Cliquez sur une portion de contour entre deux croisements pour la supprimer." # mt
hintstep.segment_delete.2 = "Tracez un rectangle sur les contours pour supprimer toutes les portions qu'il touche." # mt
hintstep.eraser.1 = "Faites glisser sur un objet pour effacer les parties que vous traversez. Un clic efface un point." # mt
hintstep.eraser.2 = "Réglez l'épaisseur et une plume ronde ou carrée dans la barre de propriétés." # mt
hintstep.eraser.3 = "Double-cliquez sur un objet avec l'outil pour le supprimer entièrement." # mt
hintstep.zoom.1 = "Cliquez pour agrandir à cet endroit." # mt
