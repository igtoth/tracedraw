hintstep.three_point_ellipse.1 = "Faites glisser pour tracer la ligne centrale de l'ellipse, selon n'importe quel angle." # mt
hintstep.three_point_ellipse.2 = "Déplacez le pointeur pour régler la hauteur et cliquez." # mt
hintstep.polygon.1 = "Réglez le nombre de points dans la barre de propriétés et faites glisser en diagonale." # mt
hintstep.polygon.2 = "Maintenez Ctrl pour un polygone symétrique, ou Maj pour tracer depuis le centre." # mt
