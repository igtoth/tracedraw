hinttopic.connector_lines = "Les lignes de connexion relient des objets et restent attachées quand ils bougent."
hinttopic.dimension_lines = "Les lignes de cote indiquent la taille des objets et la distance ou l'angle entre des points ; elles se mettent à jour quand les objets changent."
hinttopic.effects = "Donnez profondeur et mouvement avec ombres, contours, dégradés de formes, déformations, enveloppes, extrusions et transparence."
hinttopic.fill = "Remplissez les objets de couleurs uniformes, de dégradés, de motifs, de textures et de maillages. **Cliquez** sur une couleur de la palette pour remplir la sélection."
hinttopic.help = "Appuyez sur **F1** pour l'aide, gardez ce panneau **Conseils** ouvert pendant que vous travaillez et consultez l'écran d'accueil pour démarrer."
hinttopic.lines = "Le menu des outils **Courbe** regroupe les outils de tracé de lignes, à main levée ou précises, droites ou courbes."
hinttopic.move_scale = "Faites glisser un objet sélectionné pour le déplacer ; **Ctrl** le garde à l'horizontale ou à la verticale. Faites glisser une **poignée d'angle** pour redimensionner proportionnellement et une **poignée latérale** pour étirer ; **Maj** redimensionne depuis le centre. Les flèches du clavier décalent la sélection."
hinttopic.outline = "Définissez l'épaisseur, la couleur et le style des contours. **Cliquez avec le bouton droit** sur une couleur de la palette pour colorer le contour de la sélection."
hinttopic.rotate_skew = "Cliquez de nouveau sur un objet sélectionné pour afficher les poignées de rotation et d'inclinaison. Faites glisser une **flèche d'angle** pour pivoter et une **flèche latérale** pour incliner ; **Ctrl** pivote par pas de 15 degrés. Faites glisser le repère central pour changer le centre de rotation."
hinttopic.select = "Cliquez sur un objet pour le sélectionner. **Maj**+clic ajoute ou retire des objets ; faites glisser sur une zone vide pour sélectionner les objets dans le cadre ; **Alt**+clic sélectionne l'objet en dessous ; **Ctrl**+clic sélectionne un objet dans un groupe."
hinttopic.shape_objects = "Changez la forme des objets en modifiant leurs nœuds, en déformant leur contour ou en découpant et gommant des parties."
hinttopic.shapes = "Tracez rectangles, ellipses, polygones, étoiles, spirales, grilles et formes prêtes en faisant glisser en diagonale. **Ctrl** conserve les proportions ; **Maj** trace depuis le centre."
hinttopic.text = "Cliquez avec l'outil **Texte** pour ajouter du texte artistique ou faites glisser pour du texte courant dans un cadre. Cliquez dans le texte pour le modifier."
