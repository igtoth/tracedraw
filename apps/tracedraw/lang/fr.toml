welcome.new_from_template = "Nouveau à partir d'un modèle"
welcome.news_1_body = "Contour, dégradé de formes, enveloppe, extrusion (qui tourne maintenant en 3D avec plusieurs lumières et un biseau), lentille et les autres effets restent dynamiques, et le panneau Effets active, désactive et réordonne chacun."
welcome.news_1_title = "Effets dynamiques"
welcome.news_2_body = "Les encres nommées s'impriment sur leur propre plaque, et un cadre de découpe peut être un masque d'opacité dont la luminosité décide de ce qui se voit du contenu."
welcome.news_2_title = "Tons directs et masques"
welcome.news_3_body = "L'interface existe en dix-huit langues. Changez-la dans Outils > Options > Global > Général."
