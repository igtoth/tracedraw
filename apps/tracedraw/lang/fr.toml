hintstep.bezier.3 = "Cliquez sur le premier nœud pour fermer la courbe, ou double-cliquez ou appuyez sur Entrée pour terminer. Échap abandonne la courbe." # mt
hintstep.pen.1 = "Cliquez pour ajouter des nœuds d'angle reliés par des segments droits." # mt
