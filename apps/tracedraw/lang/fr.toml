welcome.choose_workspace = "Choisissez un espace de travail"
welcome.get_started = "Prise en main"
welcome.learn = "Apprendre"
welcome.learn_1_body = "Choisissez un outil dans la boîte à outils (maintenez un bouton pour ouvrir son menu contextuel) et faites glisser sur la page. Maintenez Ctrl pour contraindre, Maj pour dessiner à partir du centre."
welcome.learn_1_title = "Dessiner"
welcome.learn_2_body = "Cliquez pour sélectionner, cliquez de nouveau pour afficher les poignées de rotation et d'inclinaison, faites glisser les angles pour mettre à l'échelle. Les touches fléchées déplacent ; Maj+flèches déplacent dix fois plus loin."
welcome.learn_2_title = "Sélectionner et transformer"
welcome.learn_3_body = "Cliquez avec le bouton gauche sur une couleur de la palette pour la surface, avec le bouton droit pour le contour. Le menu fixe Propriétés permet de modifier les surfaces dégradées, à motif, de texture et Maille."
welcome.learn_3_title = "Surfaces et contours"
welcome.learn_4_body = "L'outil Forme (F10) modifie les noeuds : double-cliquez sur un segment pour ajouter un noeud, double-cliquez sur un noeud pour le supprimer, utilisez la barre de propriétés pour angulaire, lisse et symétrique."
welcome.learn_4_title = "Noeuds"
welcome.learn_5_body = "Les effets restent modifiables : ouvrez le menu fixe de l'effet depuis le menu Effets, changez les valeurs et l'objet se met à jour. Aplatir les effets les fixe définitivement."
welcome.learn_5_title = "Effets"
welcome.my_templates = "Mes modèles"
welcome.new_document = "Nouveau document"
welcome.new_from_template = "Nouveau à partir d'un modèle"
welcome.news_1_body = "Projection, dégradé, enveloppe, perspective, extrusion, biseau, ombre en bloc, lentille et transparence non uniforme sont désormais dynamiques : modifiez-les à tout moment depuis leurs menus fixes."
welcome.news_1_title = "Effets dynamiques"
welcome.news_2_body = "Texte courant avec colonnes, puces, lettrines, tabulations, coupure des mots, approche, décalage de la ligne de base, fonctions OpenType et texte sur un trajet."
welcome.news_2_title = "Moteur de texte"
welcome.news_3_body = "L'interface est disponible en anglais, chinois, hindi, espagnol, français, arabe, bengali, russe, portugais du Brésil, indonésien, allemand et japonais. Changez-la dans Outils > Options > Espace de travail."
