hinttopic.connector_lines = "Le linee di collegamento uniscono gli oggetti e restano agganciate quando gli oggetti si spostano."
hinttopic.dimension_lines = "Le linee di quota mostrano le dimensioni degli oggetti e la distanza o l'angolo tra punti; si aggiornano quando gli oggetti cambiano."
hinttopic.effects = "Dai profondità e movimento agli oggetti con ombre, profili, fusioni, distorsioni, involucri, estrusioni e trasparenza."
hinttopic.fill = "Riempi gli oggetti con colori uniformi, sfumature, motivi, texture e maglie. **Fai clic** su un colore della tavolozza per riempire la selezione."
hinttopic.help = "Premi **F1** per la guida, tieni aperto questo pannello **Suggerimenti** mentre lavori e consulta la schermata di benvenuto per iniziare."
hinttopic.lines = "Il menu a comparsa degli strumenti **Curva** contiene gli strumenti per disegnare linee, a mano libera o precise, dritte o curve."
hinttopic.move_scale = "Trascina un oggetto selezionato per spostarlo; **Ctrl** lo mantiene su una linea orizzontale o verticale. Trascina una **maniglia d'angolo** per ridimensionarlo in proporzione e una **maniglia laterale** per allungarlo; **Maiusc** ridimensiona dal centro. I tasti freccia spostano di poco la selezione."
hinttopic.outline = "Imposta lo spessore, il colore e lo stile dei contorni. **Fai clic con il pulsante destro** su un colore della tavolozza per colorare il contorno della selezione."
hinttopic.rotate_skew = "Fai di nuovo clic su un oggetto selezionato per mostrare le maniglie di rotazione e inclinazione. Trascina una **freccia d'angolo** per ruotare e una **freccia laterale** per inclinare; **Ctrl** ruota a passi di 15 gradi. Trascina l'indicatore centrale per cambiare il centro di rotazione."
hinttopic.select = "Fai clic su un oggetto per selezionarlo. **Maiusc**+clic aggiunge o rimuove oggetti; trascina su un'area vuota per selezionare gli oggetti nel riquadro di selezione; **Alt**+clic seleziona l'oggetto sottostante; **Ctrl**+clic seleziona un oggetto all'interno di un gruppo."
hinttopic.shape_objects = "Cambia la forma degli oggetti modificandone i nodi, distorcendone il contorno o tagliandone e cancellandone delle parti."
hinttopic.shapes = "Disegna rettangoli, ellissi, poligoni, stelle, spirali, griglie e forme pronte trascinando in diagonale. **Ctrl** mantiene le proporzioni; **Maiusc** disegna dal centro."
hinttopic.text = "Fai clic con lo strumento **Testo** per aggiungere testo artistico, oppure trascina per aggiungere testo paragrafo in una cornice. Fai clic nel testo per modificarlo."
