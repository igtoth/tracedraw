welcome.choose_workspace = "Scegli un'area di lavoro"
welcome.get_started = "Inizia"
welcome.learn = "Impara"
welcome.learn_1_body = "Scegli uno strumento dalla casella degli strumenti (tieni premuto un pulsante per il suo menu a comparsa) e trascina sulla pagina. Tieni premuto Ctrl per vincolare, Maiusc per disegnare dal centro."
welcome.learn_1_title = "Disegnare"
welcome.learn_2_body = "Fai clic per selezionare, fai di nuovo clic per le maniglie di rotazione e inclinazione, trascina gli angoli per ridimensionare. I tasti freccia spostano di poco; Maiusc+frecce spostano dieci volte di più."
welcome.learn_2_title = "Selezionare e trasformare"
welcome.learn_3_body = "Fai clic con il pulsante sinistro su un colore della tavolozza per il riempimento, con il destro per il contorno. Il pannello Proprietà modifica i riempimenti sfumati, a motivo, a texture e a maglia."
welcome.learn_3_title = "Riempimenti e contorni"
welcome.learn_4_body = "Lo strumento Forma (F10) modifica i nodi: fai doppio clic su un segmento per aggiungere un nodo, doppio clic su un nodo per eliminarlo, usa la barra delle proprietà per cuspide, smussato e simmetrico."
welcome.learn_4_title = "Nodi"
welcome.learn_5_body = "Gli effetti restano modificabili: apri il pannello dell'effetto dal menu Effetti, cambia i valori e l'oggetto si aggiorna. Appiattisci effetti li rende definitivi."
welcome.learn_5_title = "Effetti"
welcome.my_templates = "I miei modelli"
welcome.new_document = "Nuovo documento"
welcome.new_from_template = "Nuovo da modello"
welcome.news_1_body = "Contorno, fusione, inviluppo, estrusione (che ora ruota in 3D con più luci e smussatura), lente e gli altri effetti restano dinamici, e il pannello Effetti accende, spegne e riordina ciascuno."
welcome.news_1_title = "Effetti dinamici"
welcome.news_2_body = "Gli inchiostri spot con nome si stampano su lastre proprie, e una cornice di ritaglio può essere una maschera di opacità la cui luminosità decide quanto si vede del contenuto."
welcome.news_2_title = "Colori spot e maschere"
welcome.news_3_body = "L'interfaccia è disponibile in diciotto lingue. Cambiala in Strumenti > Opzioni > Globali > Generale."
welcome.news_3_title = "Diciotto lingue"
