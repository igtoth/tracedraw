hinttopic.effects = "Dê profundidade e movimento aos objetos com sombras, contornos, misturas, distorções, envelopes, extrusões e transparência."
hinttopic.fill = "Preencha objetos com cores uniformes, gradientes, padrões, texturas e malhas. **Clique** numa cor da paleta para preencher a seleção."
hinttopic.help = "Pressione **F1** para ajuda, mantenha este painel **Dicas** aberto enquanto trabalha e veja a Tela de boas-vindas para começar."
hinttopic.lines = "O submenu de ferramentas de **Curva** reúne as ferramentas para desenhar linhas, à mão livre ou precisas, retas ou curvas."
hinttopic.move_scale = "Arraste um objeto selecionado para movê-lo; **Ctrl** o mantém numa linha horizontal ou vertical. Arraste uma **alça de canto** para dimensionar proporcionalmente e uma **alça lateral** para esticar; **Shift** dimensiona a partir do centro. As setas do teclado deslocam a seleção."
hinttopic.outline = "Defina largura, cor e estilo dos contornos. **Clique com o botão direito** numa cor da paleta para colorir o contorno da seleção."
hinttopic.rotate_skew = "Clique de novo num objeto selecionado para mostrar as alças de rotação e inclinação. Arraste uma **seta de canto** para girar e uma **seta lateral** para inclinar; **Ctrl** gira de 15 em 15 graus. Arraste o marcador central para mudar o centro de rotação."
hinttopic.select = "Clique num objeto para selecioná-lo. **Shift**+clique adiciona ou remove objetos; arraste numa área vazia para selecionar os objetos dentro da demarcação; **Alt**+clique seleciona o objeto de baixo; **Ctrl**+clique seleciona um objeto dentro de um grupo."
hinttopic.shape_objects = "Mude a forma dos objetos editando seus nós, distorcendo o contorno ou cortando e apagando partes deles."
hinttopic.shapes = "Desenhe retângulos, elipses, polígonos, estrelas, espirais, grades e formas prontas arrastando na diagonal. **Ctrl** mantém as proporções; **Shift** desenha a partir do centro."
hinttopic.text = "Clique com a ferramenta **Texto** para adicionar texto artístico ou arraste para adicionar texto de parágrafo num quadro. Clique dentro do texto para editá-lo."
