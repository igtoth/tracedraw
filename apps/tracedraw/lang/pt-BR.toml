welcome.choose_workspace = "Escolha um espaço de trabalho"
welcome.get_started = "Começar"
welcome.learn = "Aprender"
welcome.learn_1_body = "Escolha uma ferramenta na caixa de ferramentas (segure o botão para ver o menu desdobrável) e arraste na página. Segure Ctrl para restringir, Shift para desenhar a partir do centro."
welcome.learn_1_title = "Desenhar"
welcome.learn_2_body = "Clique para selecionar, clique de novo para as alças de rotação e inclinação, arraste os cantos para redimensionar. As setas deslocam; Shift+setas deslocam dez vezes mais."
welcome.learn_2_title = "Selecionar e transformar"
welcome.learn_3_body = "Clique com o botão esquerdo em uma cor da paleta para o preenchimento, com o direito para o contorno. A janela Propriedades edita preenchimentos gradientes, de padrão, textura e malha."
welcome.learn_3_title = "Preenchimentos e contornos"
welcome.learn_4_body = "A ferramenta Forma (F10) edita nós: clique duas vezes em um segmento para adicionar um nó, duas vezes em um nó para excluí-lo, e use a barra de propriedades para cúspide, suave e simétrico."
welcome.learn_4_title = "Nós"
welcome.learn_5_body = "Os efeitos continuam editáveis: abra a janela do efeito no menu Efeitos, altere os valores e o objeto é atualizado. Achatar efeitos fixa o resultado."
welcome.learn_5_title = "Efeitos"
welcome.my_templates = "Meus modelos"
welcome.new_document = "Novo documento"
welcome.new_from_template = "Novo a partir de modelo"
welcome.news_1_body = "Contorno, mistura, envelope, perspectiva, extrusão, chanfro, sombra de bloco, lente e transparência não uniforme agora são dinâmicos: altere-os a qualquer momento nas janelas de encaixe."
welcome.news_1_title = "Efeitos dinâmicos"
welcome.news_2_body = "Texto de parágrafo com colunas, marcadores, capitulares, tabulações, hifenização, espaçamento, deslocamento de linha de base, recursos OpenType e texto em caminho."
welcome.news_2_title = "Motor de texto"
welcome.news_3_body = "A interface está disponível em inglês, chinês, hindi, espanhol, francês, árabe, bengali, russo, português do Brasil, indonésio, alemão e japonês. Altere em Ferramentas > Opções > Espaço de trabalho."
welcome.news_3_title = "Doze idiomas"
