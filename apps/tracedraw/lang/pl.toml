hinttopic.connector_lines = "Linie łączące łączą obiekty i pozostają do nich przyczepione, gdy obiekty się przesuwają."
hinttopic.dimension_lines = "Linie wymiarowe pokazują rozmiar obiektów oraz odległość lub kąt między punktami; aktualizują się, gdy obiekty się zmieniają."
hinttopic.effects = "Nadaj obiektom głębię i ruch za pomocą cieni, obrysów, mieszań, zniekształceń, obwiedni, wytłoczeń i przezroczystości."
hinttopic.fill = "Wypełniaj obiekty jednolitymi kolorami, gradientami, deseniami, teksturami i siatkami. **Kliknij** kolor palety, aby wypełnić zaznaczenie."
hinttopic.help = "Naciśnij **F1**, aby uzyskać pomoc, pozostaw ten panel **Wskazówki** otwarty podczas pracy i zajrzyj na ekran powitalny, aby zacząć."
hinttopic.lines = "Wysuwane menu narzędzi **Krzywa** zawiera narzędzia do rysowania linii: odręcznych lub precyzyjnych, prostych lub zakrzywionych."
hinttopic.move_scale = "Przeciągnij zaznaczony obiekt, aby go przesunąć; **Ctrl** utrzymuje go na linii poziomej lub pionowej. Przeciągnij **uchwyt narożny**, aby skalować proporcjonalnie, a **uchwyt boczny**, aby rozciągnąć; **Shift** skaluje od środka. Klawisze strzałek przesuwają zaznaczenie o mały krok."
hinttopic.outline = "Ustaw szerokość, kolor i styl konturów. **Kliknij prawym przyciskiem** kolor palety, aby pokolorować kontur zaznaczenia."
hinttopic.rotate_skew = "Kliknij ponownie zaznaczony obiekt, aby wyświetlić uchwyty obracania i pochylania. Przeciągnij **strzałkę narożną**, aby obrócić, a **strzałkę boczną**, aby pochylić; **Ctrl** obraca co 15 stopni. Przeciągnij znacznik środka, aby zmienić środek obrotu."
hinttopic.select = "Kliknij obiekt, aby go zaznaczyć. **Shift**+kliknięcie dodaje lub usuwa obiekty; przeciągnij w pustym miejscu, aby zaznaczyć obiekty wewnątrz ramki zaznaczania; **Alt**+kliknięcie zaznacza obiekt pod spodem; **Ctrl**+kliknięcie zaznacza obiekt wewnątrz grupy."
hinttopic.shape_objects = "Zmieniaj kształt obiektów, edytując ich węzły, zniekształcając kontur albo wycinając i wymazując ich części."
hinttopic.shapes = "Rysuj prostokąty, elipsy, wielokąty, gwiazdy, spirale, siatki i gotowe kształty, przeciągając po przekątnej. **Ctrl** zachowuje proporcje; **Shift** rysuje od środka."
hinttopic.text = "Kliknij narzędziem **Tekst**, aby dodać tekst ozdobny, albo przeciągnij, aby dodać tekst akapitowy w ramce. Kliknij wewnątrz tekstu, aby go edytować."
