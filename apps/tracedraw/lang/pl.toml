web.notice_text = "To ten sam program w Rust co aplikacja na komputer, skompilowany do WebAssembly, żeby można go wypróbować bez instalowania. Przeglądarka jest wolniejsza: duże rysunki, ciężkie efekty i duże pliki trwają dłużej, dostępne są tylko dołączone czcionki, a pliki otwiera się przez wysłanie i zapisuje jako pobrane. Do prawdziwej pracy i dużych plików używaj aplikacji na Windows, macOS lub Linux: działa natywnie, z pełną szybkością."
web.notice_download = "Pobierz aplikację na komputer"
