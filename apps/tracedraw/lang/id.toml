hinttopic.ai = "TraceDraw has no AI of its own: **AI Drawing**, **AI Generate** (create, remix, vectors) and **Remove Background** use services you connect in **Tools > Options > AI**, with your own keys, and send nothing until you ask. While a service is not set up its commands are greyed out."
hintai.cloud = "**Online services**: pick a preset (Anthropic, OpenAI, Google Gemini) and paste your API key. Gemini keys come from Google AI Studio, OpenAI keys from the OpenAI platform."
hintai.local = "**AI on this computer**: for AI Drawing pick **Ollama**, **LM Studio**, **llama.cpp** or **vLLM** (or type the address of any server with the chat completions API). No key is needed; **Test Connection** lists its models."
hintai.web = "**In the browser**, a local server must allow requests from the page (for Ollama: **OLLAMA_ORIGINS=***). The desktop app needs nothing more."
hintai.privacy = "**What is sent**: only what a command needs, when you run it. Keys stay in memory unless you ask to remember them."
