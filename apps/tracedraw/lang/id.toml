web.notice_title = "TraceDraw di peramban Anda"
web.notice_text = "Ini program Rust yang sama dengan aplikasi desktop, dikompilasi ke WebAssembly agar bisa dicoba tanpa memasang apa pun. Peramban lebih lambat: gambar besar, efek berat, dan berkas besar butuh waktu lebih lama, hanya fon bawaan yang tersedia, dan berkas dibuka dengan diunggah serta disimpan sebagai unduhan. Untuk pekerjaan sungguhan dan berkas besar, gunakan aplikasi untuk Windows, macOS, atau Linux: berjalan secara native, dengan kecepatan penuh."
