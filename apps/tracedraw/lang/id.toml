welcome.get_started = "Mulai"
welcome.learn = "Pelajari"
welcome.learn_1_body = "Pilih alat dari kotak alat (tahan tombol untuk menu lipatnya) dan seret pada halaman. Tahan Ctrl untuk membatasi, Shift untuk menggambar dari pusat."
welcome.learn_1_title = "Menggambar"
welcome.learn_2_body = "Klik untuk memilih, klik lagi untuk pegangan putar dan miring, seret sudut untuk menskalakan. Tombol panah menggeser halus; Shift+panah menggeser sepuluh kali lebih jauh."
welcome.learn_2_title = "Memilih dan mentransformasi"
welcome.learn_3_body = "Klik kiri warna palet untuk isian, klik kanan untuk garis luar. Docker Properti menyunting isian gradasi, pola, tekstur, dan jala."
welcome.learn_3_title = "Isian dan garis luar"
welcome.learn_4_body = "Alat Bentuk (F10) menyunting simpul: klik ganda segmen untuk menambah simpul, klik ganda simpul untuk menghapusnya, gunakan bilah properti untuk runcing, halus, dan simetris."
welcome.learn_4_title = "Simpul"
welcome.learn_5_body = "Efek tetap dapat disunting: buka docker efek dari menu Efek, ubah nilainya dan objek akan diperbarui. Ratakan Efek mengunci hasilnya."
welcome.learn_5_title = "Efek"
