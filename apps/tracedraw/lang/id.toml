hinttopic.connector_lines = "Garis konektor menghubungkan objek dan tetap terhubung saat objek dipindahkan."
hinttopic.dimension_lines = "Garis dimensi menunjukkan ukuran objek dan jarak atau sudut antar titik; garis diperbarui saat objek berubah."
hinttopic.effects = "Beri objek kedalaman dan gerakan dengan bayangan, kontur, paduan, distorsi, amplop, ekstrusi, dan transparansi."
hinttopic.fill = "Isi objek dengan warna seragam, gradasi, pola, tekstur, dan jaring. **Klik** warna palet untuk mengisi pilihan."
hinttopic.help = "Tekan **F1** untuk bantuan, biarkan docker **Petunjuk** ini terbuka saat bekerja, dan lihat Layar Sambutan untuk memulai."
hinttopic.lines = "Flyout alat **Kurva** berisi alat untuk menggambar garis, tangan bebas atau presisi, lurus atau melengkung."
hinttopic.move_scale = "Seret objek terpilih untuk memindahkannya; **Ctrl** menjaganya horizontal atau vertikal. Seret **pegangan sudut** untuk menskalakan proporsional dan **pegangan sisi** untuk meregangkan; **Shift** menskalakan dari pusat. Tombol panah menggeser pilihan."
hinttopic.outline = "Atur lebar, warna, dan gaya garis luar. **Klik kanan** warna palet untuk mewarnai garis luar pilihan."
hinttopic.rotate_skew = "Klik lagi objek terpilih untuk menampilkan pegangan putar dan miring. Seret **panah sudut** untuk memutar dan **panah sisi** untuk memiringkan; **Ctrl** memutar per 15 derajat. Seret penanda pusat untuk mengubah pusat putaran."
hinttopic.select = "Klik objek untuk memilihnya. **Shift**+klik menambah atau melepas objek; seret di area kosong untuk memilih objek di dalam bingkai; **Alt**+klik memilih objek di bawahnya; **Ctrl**+klik memilih objek di dalam grup."
hinttopic.shape_objects = "Ubah bentuk objek dengan mengedit simpul, mendistorsi garis luar, atau memotong dan menghapus bagiannya."
hinttopic.shapes = "Gambar persegi panjang, elips, poligon, bintang, spiral, kisi, dan bentuk siap pakai dengan menyeret secara diagonal. **Ctrl** menjaga proporsi; **Shift** menggambar dari pusat."
hinttopic.text = "Klik dengan alat **Teks** untuk menambah teks artistik, atau seret untuk teks paragraf dalam bingkai. Klik di dalam teks untuk mengeditnya."
