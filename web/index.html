<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TraceDraw</title>
  <link rel="icon" type="image/png" href="icon-256.png">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #d4d4d4; }
    canvas#tracedraw { position: absolute; inset: 0; width: 100%; height: 100%; outline: none; }
    #loading {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font: 15px system-ui, sans-serif; color: #333; text-align: center; padding: 16px;
    }
  </style>
</head>
<body>
  <canvas id="tracedraw" tabindex="0"></canvas>
  <div id="loading">Loading TraceDraw...</div>
  <script type="module">
    import init from "./tracedraw.js";
    init().catch((e) => {
      document.getElementById("loading").textContent =
        "TraceDraw could not start: " + e + ". A browser with WebAssembly and WebGL 2 is needed.";
    });
  </script>
</body>
</html>
