name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Run by hand (Actions > build > Run workflow): with a version, the run
  # makes the tag and the release itself, with the installers attached.
  workflow_dispatch:
    inputs:
      release:
        description: "Version to release, like 0.3.0 (empty: build only)"
        required: false
        default: ""

# One run per branch or tag at a time: a newer push to main cancels the
# run still going, so two runs never replace the nightly release at once.
# Version tags have groups of their own and always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # The tag this run releases ("v0.3.0"): a version tag pushed, or the
  # version asked for when run by hand; empty for every other run.
  RELEASE_TAG: ${{ (github.event_name == 'workflow_dispatch' && inputs.release != '') && format('v{0}', inputs.release) || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || '') }}

jobs:
  android-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [30, 34]
        rep: [1]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: apk
          run-id: 41162649479
          github-token: ${{ github.token }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start the app on an emulator
        # v2.38.0
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: scripts/android/emulator_check.sh "$(ls apk/*-x86_64-debug.apk | head -n 1)" dist-android/emulator-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-api${{ matrix.api }}-${{ matrix.rep }}
          path: dist-android/emulator-check
          if-no-files-found: warn

  # GitHub Pages must be set to "GitHub Actions" (Settings > Pages); the
  # job tries to enable it and does not fail the build when it cannot.
