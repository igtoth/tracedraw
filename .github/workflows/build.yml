name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Run by hand (Actions > build > Run workflow): with a version, the run
  # makes the tag and the release itself, with the installers attached.
  workflow_dispatch:
    inputs:
      release:
        description: "Version to release, like 0.3.0 (empty: build only)"
        required: false
        default: ""

# One run per branch or tag at a time: a newer push to main cancels the
# run still going, so two runs never replace the nightly release at once.
# Version tags have groups of their own and always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # The tag this run releases ("v0.3.0"): a version tag pushed, or the
  # version asked for when run by hand; empty for every other run.
  RELEASE_TAG: ${{ (github.event_name == 'workflow_dispatch' && inputs.release != '') && format('v{0}', inputs.release) || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || '') }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pinned so the clippy gate matches what contributors run locally;
      # bump it together with the version noted in AGENTS.md.
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --exclude tracedraw
      - run: cargo clippy --workspace --exclude tracedraw -- -D warnings

  # The editor's own tests (the tracedraw crate), on their own so the
  # other checks do not wait for them. They need the window system's
  # libraries to build, not a display.
  app-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: app-test
      - name: Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libgl1-mesa-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgtk-3-dev
      - run: cargo test -p tracedraw

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-x86_64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            name: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Version
        id: ver
        shell: bash
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          else
            # The workspace version from Cargo.toml, then the commit.
            base=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
            echo "version=${base}-dev.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libgl1-mesa-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgtk-3-dev libfuse2
          cargo install cargo-deb

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p tracedraw -p tracedraw-cli

      # The main window, after the splash screen and without it, can be
      # maximized and resized under a window manager (see
      # scripts/visual/window_check.sh).
      - name: Window check
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb openbox x11-utils libgl1-mesa-dri libxkbcommon-x11-0
          scripts/visual/window_check.sh target/${{ matrix.target }}/release/tracedraw

      # Windows code signing, see docs/code-signing.md. Release builds (v*
      # tags) are signed once a provider is set up in the repository's
      # secrets and variables; builds of main too when the SIGN_NIGHTLY
      # variable is "true". Azure Artifact Signing wins when both are set.
      # Without a provider the files stay unsigned, as before.
      - name: Signing provider
        id: signing
        if: runner.os == 'Windows'
        shell: bash
        env:
          HAS_AZURE: ${{ secrets.AZURE_CLIENT_SECRET != '' }}
          HAS_SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
          SIGN_NIGHTLY: ${{ vars.SIGN_NIGHTLY }}
        run: |
          provider=none
          if [[ -n "$RELEASE_TAG" || ( "$GITHUB_EVENT_NAME" == push && "$SIGN_NIGHTLY" == true ) ]]; then
            if [[ "$HAS_AZURE" == true ]]; then
              provider=azure
            elif [[ "$HAS_SIGNPATH" == true ]]; then
              provider=signpath
            fi
          fi
          echo "provider=$provider" >> "$GITHUB_OUTPUT"
          echo "Windows code signing: $provider" >> "$GITHUB_STEP_SUMMARY"

      - name: Sign the programs (Azure Artifact Signing)
        if: steps.signing.outputs.provider == 'azure'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: |
            ${{ github.workspace }}\target\${{ matrix.target }}\release\tracedraw.exe
            ${{ github.workspace }}\target\${{ matrix.target }}\release\tracedraw-cli.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: TraceDraw
          description-url: https://github.com/igtoth/tracedraw

      - name: Programs to sign (SignPath)
        id: unsigned-programs
        if: steps.signing.outputs.provider == 'signpath'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-programs
          path: |
            target/${{ matrix.target }}/release/tracedraw.exe
            target/${{ matrix.target }}/release/tracedraw-cli.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign the programs (SignPath)
        if: steps.signing.outputs.provider == 'signpath'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: programs
          github-artifact-id: ${{ steps.unsigned-programs.outputs.artifact-id }}
          wait-for-completion: true
          # A release waits for its approval in SignPath.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-programs

      - name: Use the signed programs (SignPath)
        if: steps.signing.outputs.provider == 'signpath'
        shell: pwsh
        run: Copy-Item signed-programs\*.exe "target\${{ matrix.target }}\release\" -Force

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $src = "target\${{ matrix.target }}\release"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DVersion=${{ steps.ver.outputs.version }} /DSrcDir="$PWD\$src" packaging\windows\tracedraw.iss
          # The portable zip carries the settings folder, so it keeps its
          # preferences beside the program and writes nothing to %APPDATA%.
          Copy-Item -Recurse -Force packaging\windows\portable\tracedraw-settings "$src\tracedraw-settings"
          Compress-Archive -Path "$src\tracedraw.exe","$src\tracedraw-cli.exe","$src\tracedraw-settings",README.md,LICENSE-MIT,LICENSE-APACHE -DestinationPath "dist\tracedraw-${{ steps.ver.outputs.version }}-windows-x86_64-portable.zip"

      # The Microsoft Store package (the Store signs it). Attached to the
      # release once the Store identity variables are set; until then a
      # check package is built and not published.
      - name: Store package (Windows)
        if: runner.os == 'Windows'
        # Only a check until the Store identity is set: it must not hold
        # back the other downloads.
        continue-on-error: ${{ vars.MSIX_IDENTITY_NAME == '' }}
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_NAME: ${{ vars.MSIX_PUBLISHER_NAME }}
        run: packaging\windows\build-msix.ps1 -Version "${{ steps.ver.outputs.version }}" -SrcDir "target\${{ matrix.target }}\release"

      - name: Sign the installer (Azure Artifact Signing)
        if: steps.signing.outputs.provider == 'azure'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: TraceDraw Setup
          description-url: https://github.com/igtoth/tracedraw

      - name: Installer to sign (SignPath)
        id: unsigned-installer
        if: steps.signing.outputs.provider == 'signpath'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: dist/*-setup.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign the installer (SignPath)
        if: steps.signing.outputs.provider == 'signpath'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-installer

      - name: Use the signed installer (SignPath)
        if: steps.signing.outputs.provider == 'signpath'
        shell: pwsh
        run: Copy-Item signed-installer\*-setup.exe dist\ -Force

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          arch=$([[ "${{ matrix.target }}" == aarch64* ]] && echo arm64 || echo x86_64)
          packaging/macos/build-dmg.sh "${{ steps.ver.outputs.version }}" "target/${{ matrix.target }}/release" "$arch"
          rm -rf dist/TraceDraw.app

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cargo deb -p tracedraw --target ${{ matrix.target }} --no-build --deb-version "${{ steps.ver.outputs.version }}" -o dist/
          arch=$([[ "${{ matrix.target }}" == aarch64* ]] && echo arm64 || echo x86_64)
          packaging/linux/build-appimage.sh "${{ steps.ver.outputs.version }}" "target/${{ matrix.target }}/release" "$arch"
          rm -f dist/linuxdeploy.AppImage
          tar -C "target/${{ matrix.target }}/release" -czf "dist/tracedraw-${{ steps.ver.outputs.version }}-linux-$arch.tar.gz" tracedraw tracedraw-cli

      - uses: actions/upload-artifact@v4
        with:
          name: tracedraw-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  # The browser build: WebAssembly and WebGL 2, published to GitHub Pages
  # and attached to the releases as tracedraw-<version>-web.zip.
  web:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32

      - name: Version
        id: ver
        shell: bash
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          else
            # The workspace version from Cargo.toml, then the commit.
            base=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
            echo "version=${base}-dev.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      # build.rs bundles these into the module (the browser has no system
      # fonts): Liberation, DejaVu Sans and Noto for Devanagari and Bengali.
      - name: Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-liberation fonts-dejavu-core fonts-noto-core

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129

      # binaryen's wasm-opt shrinks the module (Page step), from a pinned
      # release checked against its SHA-256.
      - name: Binaryen
        env:
          BINARYEN: version_133
          BINARYEN_SHA256: 2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489
        run: |
          file="binaryen-${BINARYEN}-x86_64-linux.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$file" "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN}/$file"
          echo "$BINARYEN_SHA256  $RUNNER_TEMP/$file" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-${BINARYEN}/bin" >> "$GITHUB_PATH"

      - name: Build
        run: cargo build --target wasm32-unknown-unknown --profile web -p tracedraw

      - name: Page
        run: |
          mkdir -p site dist
          wasm-bindgen --target web --no-typescript --out-dir site target/wasm32-unknown-unknown/web/tracedraw.wasm
          # Optimise for size and drop the name, debug and producer
          # sections before the size is measured.
          wasm-opt -Oz --strip-debug --strip-producers -o site/tracedraw_bg.wasm site/tracedraw_bg.wasm
          cp web/FONTS.md site/
          # The page with the module's size (the download shows its progress)
          # and the version.
          size=$(wc -c < site/tracedraw_bg.wasm | tr -d ' ')
          sed -e "s/data-wasm-size=\"0\"/data-wasm-size=\"$size\"/" -e "s/@VERSION@/${{ steps.ver.outputs.version }}/" \
              web/index.html > site/index.html
          grep -q "data-wasm-size=\"$size\"" site/index.html
          if grep -q "@VERSION@" site/index.html; then exit 1; fi
          cp assets/icon/tracedraw-256.png site/icon-256.png
          # The installable app (docs/behavior/web.md, "Installing on a
          # tablet"): the manifest, its icons and the service worker, whose
          # cache is named after the version and a digest of the page,
          # script and module, so every deploy is a new worker and a new
          # cache (never a stale module against a new script).
          cp web/manifest.webmanifest site/
          cp assets/icon/tracedraw-192.png site/icon-192.png
          cp assets/icon/tracedraw-512.png site/icon-512.png
          build=$(cat site/index.html site/tracedraw.js site/tracedraw_bg.wasm site/manifest.webmanifest | sha256sum | cut -c1-16)
          sed -e "s/@VERSION@/${{ steps.ver.outputs.version }}/" -e "s/@BUILD@/$build/" web/sw.js > site/sw.js
          # The module loads, the page links the manifest and registers the
          # worker, the manifest and the worker are valid and name files the
          # site holds (Node, no packages, no network).
          node scripts/web/check_pwa.mjs site
          (cd site && zip -r "../dist/tracedraw-${{ steps.ver.outputs.version }}-web.zip" .)

      # The font folder of the published page (web/fonts.txt): free fonts
      # the page fetches the first time a drawing's text needs them, so
      # they cost nothing until used. Not in the release zip, which works
      # without it.
      - name: Font folder
        run: |
          for p in fonts-texgyre fonts-dejavu-core fonts-dejavu-extra fonts-dejavu-mono; do
            sudo apt-get install -y --no-install-recommends "$p" || echo "::warning::font package $p is not available"
          done
          python3 web/font_folder.py web/fonts.txt site/fonts

      # The font catalog: every other family of the google/fonts collection
      # at the pinned commit, fetched by the page from GitHub's file server
      # the first time a drawing's text needs it (web/font_catalog.py).
      - name: Font catalog
        run: python3 web/font_catalog.py web/fonts.txt site/fonts

      # The user Help (docs/help), one tree per interface language, with
      # the screenshots of docs/help/img; the app's "?" buttons and F1
      # open its pages (docs/behavior/help.md).
      - name: Help
        run: python3 web/help_site.py docs/help apps/tracedraw/lang site/help

      # The browser version is published on the project's page, not as a
      # download: the folder is kept with the run only (its name does not
      # match the release's tracedraw-* artifacts).
      - uses: actions/upload-artifact@v4
        with:
          name: web-site
          path: dist/*
          if-no-files-found: error

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # The Android app (docs/behavior/android.md, docs/android-play.md): the
  # editor as a shared library for 64-bit ARM, built with the NDK and
  # build tools the runner has, as a debug-signed APK to install by hand
  # and as an App Bundle (.aab) for Google Play. The bundle is signed with
  # the upload key when the ANDROID_KEYSTORE_* secrets are set (Play App
  # Signing) and with the debug key otherwise. Both are kept with the
  # run only, never attached to the releases (their names do not match
  # tracedraw-*): uploading to Play is the owner's step.
  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - name: Build
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # 64-bit ARM for tablets and phones; x86_64 for Chromebooks and
          # the emulator check below.
          ANDROID_ABIS: arm64-v8a x86_64
        run: |
          # The newest NDK the runner has, the SDK's build tools and the
          # platform the app targets (installed when the runner lacks it).
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK $ANDROID_NDK_HOME, SDK $ANDROID_HOME"
          if [ ! -f "$ANDROID_HOME/platforms/android-36/android.jar" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" >/dev/null
          fi
          scripts/android/build.sh
          ls -la dist-android/*.apk dist-android/*.aab
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist-android/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: dist-android/*.aab
          if-no-files-found: error

  # The app started on Android emulators, Android 11 and Android 14
  # (scripts/android/emulator_check.sh): the x86_64 APK installed,
  # launched from its launcher activity, still running 45 s later, nothing
  # crashed in the system log, its first frame drawn with the system fonts
  # loaded and the editor on the screenshot. The runner's KVM runs the
  # emulator at full speed; the x86_64 library is the same code as the
  # ARM64 one (the emulator's ARM translation stops the ARM64 library in
  # the activity glue's first JNI calls, which the x86_64 one passes, so
  # it cannot stand in for an ARM device). The screenshot and the logs
  # are kept as the android-emulator-api* artifacts.
  android-emulator:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [30, 34]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start the app on an emulator
        # v2.38.0
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: scripts/android/emulator_check.sh "$(ls apk/*-x86_64-debug.apk | head -n 1)" dist-android/emulator-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-api${{ matrix.api }}
          path: dist-android/emulator-check
          if-no-files-found: warn

  # GitHub Pages must be set to "GitHub Actions" (Settings > Pages); the
  # job tries to enable it and does not fail the build when it cannot.
  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: web
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deploy
        uses: actions/deploy-pages@v4

  # Version tags publish a release; every push to main refreshes the
  # "nightly" pre-release with the installers of that commit.
  release:
    if: (github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')) || (github.event_name == 'workflow_dispatch' && inputs.release != '')
    needs: [build, web, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Only CHANGELOG.md is needed, for the notes of a version.
      - uses: actions/checkout@v5
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: tracedraw-*
          merge-multiple: true
      # The Android APKs (one per ABI, signed with a debug key) go with the
      # installers, so a tablet can install the build of the same commit.
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          name: android-apk
      - name: Release notes
        shell: bash
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            # The version's section of CHANGELOG.md ("## 0.3.0 (date)").
            v="${RELEASE_TAG#v}"
            awk -v head="## ${v} " 'index($0, head) == 1 { p = 1; next } /^## / && p { exit } p' CHANGELOG.md > release-notes.md
          else
            echo "Installers built from ${GITHUB_SHA} on main. Replaced on every push." > release-notes.md
          fi
          printf '\nCode signing policy: https://github.com/%s#code-signing-policy\n' "$GITHUB_REPOSITORY" >> release-notes.md
          cat release-notes.md
      - name: Drop the previous nightly
        if: env.RELEASE_TAG == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete nightly --repo "${{ github.repository }}" --cleanup-tag --yes || true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          tag_name: ${{ env.RELEASE_TAG != '' && env.RELEASE_TAG || 'nightly' }}
          name: ${{ env.RELEASE_TAG != '' && env.RELEASE_TAG || 'Nightly build' }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ env.RELEASE_TAG == '' }}
          make_latest: ${{ env.RELEASE_TAG != '' && 'true' || 'false' }}
          body_path: release-notes.md

  # Microsoft Store: a version's MSIX is submitted for certification, once
  # the Store API secrets and the MSSTORE_APP_ID variable are set (see
  # docs/code-signing.md). The new submission copies the last published one
  # (listings, screenshots, price, age ratings) and replaces only the
  # package. It works once the app is live in the Store, and a failure here
  # never holds back the release.
  store:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.release != '')
    needs: release
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Store API
        id: store
        shell: bash
        env:
          HAS_MSSTORE: ${{ secrets.MSSTORE_CLIENT_SECRET != '' && vars.MSSTORE_APP_ID != '' }}
        run: |
          echo "enabled=$HAS_MSSTORE" >> "$GITHUB_OUTPUT"
          if [[ "$HAS_MSSTORE" != true ]]; then
            echo "Microsoft Store: API not set up, nothing submitted" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/download-artifact@v4
        if: steps.store.outputs.enabled == 'true'
        with:
          path: store
          pattern: tracedraw-windows-*
          merge-multiple: true
      - uses: microsoft/microsoft-store-apppublisher@v1.1
        if: steps.store.outputs.enabled == 'true'
      - name: Submit to the Microsoft Store
        if: steps.store.outputs.enabled == 'true'
        shell: pwsh
        env:
          MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          MSSTORE_APP_ID: ${{ vars.MSSTORE_APP_ID }}
        run: |
          $msix = Get-ChildItem store\*.msix | Select-Object -First 1
          if (-not $msix) { throw 'No .msix in the Windows build' }
          msstore reconfigure --tenantId $env:MSSTORE_TENANT_ID --sellerId $env:MSSTORE_SELLER_ID --clientId $env:MSSTORE_CLIENT_ID --clientSecret $env:MSSTORE_CLIENT_SECRET
          if ($LASTEXITCODE -ne 0) { throw "msstore reconfigure failed ($LASTEXITCODE)" }
          # Uploads the package and commits the submission for certification.
          msstore publish $msix.FullName --appId $env:MSSTORE_APP_ID
          if ($LASTEXITCODE -ne 0) { throw "msstore publish failed ($LASTEXITCODE)" }
          "Microsoft Store: $($msix.Name) submitted for certification" >> $env:GITHUB_STEP_SUMMARY
