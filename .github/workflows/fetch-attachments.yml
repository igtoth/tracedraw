# Downloads the files attached to issues (listed in attachments/urls.txt)
# into this branch, so tools that can only reach the repository can read
# them. Runs only on pushes to the attachments-inbox branch.
name: Fetch issue attachments
on:
  push:
    branches: [attachments-inbox]
    paths: [attachments/urls.txt]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the attachments
        run: |
          while read -r issue url; do
            [ -z "$url" ] && continue
            mkdir -p "attachments/$issue"
            name="$(basename "$url")"
            id="$(basename "$(dirname "$url")")"
            out="attachments/$issue/${id}-${name}"
            [ -e "$out" ] && continue
            curl -sSfL --retry 3 --max-filesize 95000000 -o "$out" "$url" || { rm -f "$out"; echo "FAILED $issue $url" >> attachments/failed.txt; }
          done < attachments/urls.txt
          du -sh attachments
      - name: Commit them to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add attachments
          git commit -m "Issue attachments fetched by CI" || exit 0
          git push
