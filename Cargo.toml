[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/cdr",
    "crates/io",
    "apps/traco",
    "apps/traco-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/igtoth/traco"
rust-version = "1.80"

[workspace.dependencies]
traco-core = { path = "crates/core" }
traco-cdr = { path = "crates/cdr" }
traco-io = { path = "crates/io" }

kurbo = { version = "0.13", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
zip = { version = "4", default-features = false, features = ["deflate"] }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.36"
rfd = "0.17"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

[profile.dev.package."*"]
opt-level = 2
