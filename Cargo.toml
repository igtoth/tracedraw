[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/cdr",
    "crates/io",
    "crates/text",
    "crates/render",
    "apps/tracedraw",
    "apps/tracedraw-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/igtoth/tracedraw"
rust-version = "1.80"

[workspace.dependencies]
tracedraw-core = { path = "crates/core" }
tracedraw-cdr = { path = "crates/cdr" }
tracedraw-io = { path = "crates/io" }
tracedraw-text = { path = "crates/text" }
tracedraw-render = { path = "crates/render" }

kurbo = { version = "0.13", features = ["serde"] }
tiny-skia = "0.12"
fontdb = "0.24"
ttf-parser = "0.25"
rustybuzz = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
zip = { version = "4", default-features = false, features = ["deflate"] }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.36"
rfd = "0.17"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

[profile.dev.package."*"]
opt-level = 2
