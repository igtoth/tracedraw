[workspace]
resolver = "2"
# Patched copies of dependencies, not workspace members (vendor/README.md).
exclude = ["vendor"]
members = [
    "crates/core",
    "crates/cdr",
    "crates/io",
    "crates/text",
    "crates/render",
    "crates/vba",
    "crates/vba-project",
    "apps/tracedraw",
    "apps/tracedraw-cli",
]

[workspace.package]
version = "0.19.11"
edition = "2021"
authors = ["Ighor Toth"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/igtoth/tracedraw"
homepage = "https://github.com/igtoth/tracedraw"
rust-version = "1.89"

[workspace.dependencies]
tracedraw-core = { path = "crates/core" }
tracedraw-cdr = { path = "crates/cdr" }
tracedraw-io = { path = "crates/io" }
tracedraw-text = { path = "crates/text" }
tracedraw-render = { path = "crates/render" }
tracedraw-vba = { path = "crates/vba" }
tracedraw-vba-project = { path = "crates/vba-project" }

kurbo = { version = "0.13", features = ["serde"] }
tiny-skia = "0.12"
fontdb = "0.24"
ttf-parser = "0.25"
rustybuzz = "0.20"
unicode-general-category = "1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
zip = { version = "4", default-features = false, features = ["deflate"] }
encoding_rs = "0.8"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.36"
rfd = "0.17"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

# The browser build (wasm32): size matters more than the last percent of speed.
[profile.web]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2

# eframe 0.36.2 with the OpenGL context fallback of eframe 0.37 (an
# OpenGL 2.1 driver gets a compatibility context, #616); see
# vendor/README.md. Drop it when moving to egui 0.37 or later.
[patch.crates-io]
eframe = { path = "vendor/eframe" }
