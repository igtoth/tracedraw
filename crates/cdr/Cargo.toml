[package]
name = "tracedraw-cdr"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Clean-room reader for .cdr files: RIFF and ZIP containers"

[dependencies]
tracedraw-core.workspace = true
tracedraw-cdr-format.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
zip.workspace = true
encoding_rs.workspace = true
flate2 = "1"
ttf-parser.workspace = true
tiny-skia.workspace = true

[dev-dependencies]
tracedraw-core = { workspace = true, features = ["test-profiles"] }
tracedraw-cdr-format = { workspace = true, features = ["test-support"] }
