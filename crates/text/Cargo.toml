[package]
name = "tracedraw-text"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Font discovery, shaping and glyph outlines for TraceDraw"

[dependencies]
tracedraw-core.workspace = true
kurbo.workspace = true
fontdb = { version = "0.24", default-features = false, features = ["std"] }
ttf-parser.workspace = true
rustybuzz.workspace = true
unicode-bidi = "0.3"
encoding_rs.workspace = true
unicode-general-category.workspace = true
log.workspace = true

# System font discovery exists only natively; the browser build registers
# its fonts with `add_font_data`.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fontdb = { version = "0.24", features = ["fs", "memmap", "fontconfig"] }

# The fonts Windows lists as installed, from its registry.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry"] }
